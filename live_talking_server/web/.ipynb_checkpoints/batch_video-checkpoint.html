<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人对话系统 - 批量视频生成</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #f8fafc;
            --cream-2: #f0f9ff;
            --cream-3: #e0f2fe;
            --terracotta: #06b6d4;
            --terracotta-light: #38bdf8;
            --terracotta-pale: #e0f2fe;
            --sage: #0891b2;
            --sage-pale: #cffafe;
            --lavender: #7dd3fc;
            --text-dark: #0f172a;
            --text-mid: #334155;
            --text-light: #64748b;
            --panel-bg: rgba(255, 255, 255, 0.86);
            --border: rgba(6, 182, 212, 0.14);
            --primary: var(--terracotta);
            --primary-2: #38bdf8;
            --success: #0891b2;
            --warning: #38bdf8;
            --danger: #06b6d4;
            --shadow-soft: 0 18px 48px rgba(6, 182, 212, 0.12);
            --shadow-card: 0 10px 30px rgba(6, 182, 212, 0.1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(6, 182, 212, 0.22), transparent 34%),
                radial-gradient(circle at top right, rgba(125, 211, 252, 0.16), transparent 30%),
                linear-gradient(180deg, #f8fafc 0%, #f0f9ff 100%);
            min-height: 100vh;
            color: var(--text-dark);
            padding: 16px;
            overflow: hidden;
        }

        .container {
            position: relative;
            max-width: 1600px;
            height: calc(100vh - 32px);
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.74));
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 30px;
            padding: 24px 26px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 180px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.16), rgba(8, 145, 178, 0.08) 56%, rgba(125, 211, 252, 0.1));
            pointer-events: none;
        }

        h1 {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
        }

        h1::after {
            content: '';
            display: block;
            width: 88px;
            height: 4px;
            margin: 12px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.12), var(--terracotta), rgba(8, 145, 178, 0.22));
        }

        .main-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(680px, 1.48fr) minmax(360px, 0.92fr);
            gap: 20px;
            align-items: stretch;
            height: calc(100% - 74px);
            min-height: 0;
        }

        .left-panel,
        .right-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            min-height: 0;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(8px);
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-gutter: stable;
        }

        .section-title {
            margin-bottom: 10px;
            color: var(--text-mid);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .avatar-list {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2px;
        }

        .avatar-item {
            width: 98px;
            cursor: pointer;
            border-radius: 18px;
            padding: 12px 10px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.12);
            box-shadow: 0 6px 16px rgba(44, 36, 32, 0.06);
            transition: all 0.25s ease;
            text-align: center;
        }

        .avatar-item:hover {
            background: linear-gradient(180deg, #ffffff, #f7ece4);
            border-color: rgba(196, 113, 74, 0.24);
            box-shadow: 0 12px 24px rgba(196, 113, 74, 0.14);
            transform: translateY(-3px);
        }

        .avatar-item.active {
            border-color: var(--terracotta);
            background: linear-gradient(180deg, #fff7f1, var(--terracotta-pale));
            box-shadow: 0 12px 28px rgba(196, 113, 74, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        .avatar-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 8px;
            object-fit: cover;
            border: 2px solid rgba(196, 113, 74, 0.22);
            background: var(--cream-2);
        }

        .avatar-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 情绪感知样式 */
        .camera-section {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 4 / 3;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1816;
            border: 1px solid rgba(196, 113, 74, 0.16);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            margin: 0 auto 12px;
        }

        #emotion-input.active {
            display: grid;
            grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
            gap: 8px 12px;
            align-items: start;
        }

        #emotion-input.active .camera-section {
            grid-column: 1;
            grid-row: 1 / span 2;
            width: 100%;
            max-width: none;
            aspect-ratio: 16 / 10;
            margin: 0;
        }

        #emotion-input.active .emotion-display {
            grid-column: 2;
            margin-bottom: 0;
            min-height: 0;
        }

        #emotion-input.active .emotion-scores {
            grid-column: 2;
            margin-bottom: 0;
        }

        #emotion-input.active .emotion-controls {
            grid-column: 1 / -1;
        }

        #emotion-camera {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 1;
            object-fit: cover;
            background: #201c19;
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            left: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(44, 36, 32, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 4px 10px;
            border-radius: 999px;
            z-index: 3;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(32, 27, 24, 0.72), rgba(32, 27, 24, 0.88));
            color: rgba(255, 255, 255, 0.86);
            font-size: 14px;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .camera-overlay .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .emotion-display {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .emotion-icon {
            font-size: 1.8rem;
            margin-right: 10px;
            min-width: 34px;
            text-align: center;
        }

        .emotion-text {
            font-size: 0.98rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .emotion-scores {
            margin-bottom: 12px;
        }

        .emotion-score-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .emotion-score-name {
            width: 52px;
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 600;
        }

        .emotion-score-bar {
            flex: 1;
            height: 7px;
            background: var(--cream-3);
            border-radius: 999px;
            margin: 0 8px;
            overflow: hidden;
        }

        .emotion-score-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .emotion-score-value {
            width: 42px;
            text-align: right;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
        }

        .emotion-controls {
            padding: 12px 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
        }

        .right-panel.emotion-mode {
            gap: 10px;
        }

        .right-panel.emotion-mode .status-bar {
            padding: 12px 14px;
            border-radius: 16px;
        }

        .right-panel.emotion-mode .chat-section {
            flex: 0 0 auto;
            min-height: 0;
            padding-top: 8px;
        }

        .right-panel.emotion-mode .chat-history {
            flex: 0 0 auto;
            height: clamp(180px, 28vh, 300px);
            min-height: 180px;
            max-height: 300px;
        }

        .right-panel.emotion-mode .chat-header {
            margin-bottom: 6px;
        }

        .right-panel.emotion-mode .input-tabs {
            margin-bottom: 10px;
        }

        .right-panel.emotion-mode .camera-overlay {
            font-size: 13px;
        }

        .right-panel.emotion-mode .camera-overlay .icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .right-panel.emotion-mode .camera-label {
            bottom: 8px;
            left: 10px;
            padding: 3px 8px;
            font-size: 11px;
        }

        .right-panel.emotion-mode .emotion-display {
            padding: 10px 12px;
            min-height: 52px;
        }

        .right-panel.emotion-mode .emotion-icon {
            font-size: 1.55rem;
            min-width: 30px;
            margin-right: 8px;
        }

        .right-panel.emotion-mode .emotion-text {
            font-size: 0.92rem;
        }

        .right-panel.emotion-mode .emotion-score-item {
            margin-bottom: 6px;
        }

        .right-panel.emotion-mode .emotion-score-name {
            width: 42px;
            font-size: 12px;
        }

        .right-panel.emotion-mode .emotion-score-bar {
            height: 6px;
            margin: 0 6px;
        }

        .right-panel.emotion-mode .emotion-score-value {
            width: 34px;
            font-size: 11px;
        }

        .right-panel.emotion-mode .emotion-controls {
            padding: 10px 12px;
        }

        .right-panel.emotion-mode .switch-label {
            gap: 8px;
            font-size: 13px;
        }

        .right-panel.emotion-mode .emotion-status {
            margin-top: 6px;
            font-size: 11px;
        }

        .right-panel.emotion-mode .hold-to-talk-btn {
            padding: 12px 16px;
            font-size: 14px;
            box-shadow: 0 10px 22px rgba(196, 113, 74, 0.2);
        }

        .emotion-action-group {
            display: none;
        }

        .emotion-action-group:not(.hidden) {
            display: block;
        }

        #tongue-input.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }

        #tongue-input.active .tongue-camera-section {
            order: 1;
            width: 100%;
            max-width: none;
            aspect-ratio: 16 / 9;
            min-height: clamp(260px, 34vh, 420px);
            margin: 0;
        }

        #tongue-input.active .tongue-result {
            order: 2;
            width: 100%;
            margin-bottom: 0;
        }

        #tongue-input.active .tongue-guide {
            order: 3;
            width: 100%;
            margin-bottom: 0;
        }

        #tongue-input.active .tongue-status {
            order: 4;
            width: 100%;
            margin-bottom: 0;
        }

        #tongue-camera {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 1;
            object-fit: cover;
            background: #201c19;
            transform: scaleX(-1);
        }

        .tongue-guide,
        .tongue-status,
        .tongue-result {
            padding: 12px 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
        }

        .tongue-guide {
            color: var(--text-dark);
            font-size: 13px;
            line-height: 1.65;
            min-height: 72px;
        }

        .tongue-status {
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 600;
        }

        .tongue-status.error {
            color: #c95e56;
        }

        .tongue-result {
            display: block;
        }

        .tongue-result.hidden {
            display: none;
        }

        .tongue-result-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .tongue-result-item {
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(196, 113, 74, 0.08);
        }

        .tongue-result-label {
            color: var(--text-light);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .tongue-result-value {
            color: var(--text-dark);
            font-size: 18px;
            font-weight: 700;
        }

        .tongue-result-tip {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(196, 113, 74, 0.18);
            color: var(--text-mid);
            font-size: 12px;
            line-height: 1.6;
        }

        .tongue-action-group {
            display: none;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tongue-action-group:not(.hidden) {
            display: flex;
        }

        .tongue-action-group .hidden {
            display: none;
        }

        .right-panel.tongue-mode {
            gap: 10px;
        }

        .right-panel.tongue-mode .status-bar {
            padding: 12px 14px;
            border-radius: 16px;
        }

        .right-panel.tongue-mode .chat-section {
            flex: 0 0 auto;
            min-height: 0;
            padding-top: 8px;
        }

        .right-panel.tongue-mode .chat-history {
            display: none;
        }

        .right-panel.tongue-mode .chat-header {
            display: none;
        }

        .right-panel.tongue-mode .chat-count {
            display: none;
        }

        .right-panel.tongue-mode .input-tabs {
            margin-bottom: 10px;
        }

        .right-panel.tongue-mode #tongue-input.active {
            margin-top: 0;
        }

        .right-panel.tongue-mode .camera-overlay {
            font-size: 13px;
        }

        .right-panel.tongue-mode .camera-overlay .icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .right-panel.tongue-mode .camera-label {
            bottom: 8px;
            left: 10px;
            padding: 3px 8px;
            font-size: 11px;
        }

        .right-panel.tongue-mode .tongue-guide,
        .right-panel.tongue-mode .tongue-status,
        .right-panel.tongue-mode .tongue-result {
            padding: 10px 12px;
        }

        .right-panel.tongue-mode .tongue-guide,
        .right-panel.tongue-mode .tongue-status,
        .right-panel.tongue-mode .tongue-result-tip {
            font-size: 12px;
        }

        .right-panel.tongue-mode .tongue-result-label {
            font-size: 11px;
        }

        .right-panel.tongue-mode .tongue-result-value {
            font-size: 16px;
        }

        .hold-to-talk-btn {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: 0 14px 28px rgba(196, 113, 74, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            user-select: none;
            touch-action: none;
        }

        .hold-to-talk-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(196, 113, 74, 0.28);
        }

        .hold-to-talk-btn.recording {
            background: linear-gradient(135deg, #c95e56, #e58a7f);
            box-shadow: 0 18px 34px rgba(201, 94, 86, 0.3);
        }

        .hold-to-talk-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .switch-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
        }

        .switch-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--terracotta);
        }

        .emotion-status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-light);
        }

        .video-shell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            width: 100%;
        }

        .video-container {
            position: relative;
            width: min(100%, calc((100vh - 310px) * 16 / 9));
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border-radius: 26px;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1916 0%, #0f0d0c 100%);
            border: 1px solid rgba(196, 113, 74, 0.12);
            box-shadow: 0 24px 52px rgba(44, 36, 32, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .video-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        #render-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }

        #idle-video,
        #idle-video-2,
        #response-video {
            display: none;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.78);
            font-size: 18px;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.04), transparent 36%),
                linear-gradient(180deg, rgba(18, 15, 13, 0.84), rgba(18, 15, 13, 0.96));
        }

        .video-overlay .icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .status-bar {
            margin-bottom: 0;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.1);
            box-shadow: 0 8px 20px rgba(44, 36, 32, 0.06);
            color: var(--text-dark);
        }

        .status-bar.ready { background: linear-gradient(180deg, #f3fbf6, var(--sage-pale)); color: var(--sage); }
        .status-bar.processing { background: linear-gradient(180deg, #fff6ef, #fde5d7); color: var(--terracotta); }
        .status-bar.success { background: linear-gradient(180deg, #f3fbf6, var(--sage-pale)); color: var(--success); }
        .status-bar.error { background: linear-gradient(180deg, #fff2ef, #ffe1da); color: #c95e56; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(196, 113, 74, 0.12);
            border-radius: 999px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active { display: block; }

        .progress {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--terracotta-light), var(--terracotta));
            transition: width 0.3s ease;
        }

        .input-tabs {
            display: flex;
            margin-bottom: 14px;
            background: linear-gradient(180deg, #faf4ed, #f1e7dc);
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
            padding: 6px;
        }

        .input-tab {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-mid);
        }

        .input-tab.active {
            background: rgba(255, 255, 255, 0.94);
            color: var(--terracotta);
            box-shadow: 0 6px 16px rgba(44, 36, 32, 0.08);
        }

        .input-tab-content { display: none; }
        .input-tab-content.active { display: block; }

        textarea {
            width: 100%;
            min-height: 96px;
            padding: 16px;
            border: 1px solid #e7d8ca;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--text-dark);
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracotta);
            box-shadow: 0 0 0 4px rgba(196, 113, 74, 0.1);
        }

        textarea::placeholder {
            color: var(--text-light);
        }

        .audio-record-section {
            text-align: center;
            padding: 18px 14px 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.1);
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(196, 113, 74, 0.24);
            background: linear-gradient(180deg, #ffffff, #fbf4ed);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 18px rgba(44, 36, 32, 0.08);
        }

        .record-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(196, 113, 74, 0.16);
        }

        .record-btn.recording {
            border-color: var(--terracotta);
            background: linear-gradient(180deg, #fff0e7, #f6d3c1);
            animation: pulse 1s infinite;
        }

        .record-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--terracotta);
        }

        .record-btn.recording .record-icon {
            width: 24px;
            height: 24px;
            border-radius: 5px;
        }

        .record-hint {
            color: var(--text-mid);
            font-size: 14px;
        }

        .audio-preview {
            margin-top: 16px;
            display: none;
        }

        .audio-preview audio {
            width: 100%;
            max-width: 320px;
            accent-color: var(--terracotta);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }

        .button-group.hidden,
        .emotion-action-group.hidden,
        .tongue-action-group.hidden {
            display: none;
        }

        button {
            flex: 1;
            padding: 13px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            box-shadow: 0 12px 26px rgba(196, 113, 74, 0.22);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(196, 113, 74, 0.28);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            color: var(--text-dark);
            border: 1px solid rgba(196, 113, 74, 0.12);
        }

        .btn-secondary:hover:not(:disabled) {
            background: linear-gradient(180deg, #fff9f5, var(--terracotta-pale));
            color: var(--terracotta);
        }

        .chat-section {
            margin-top: 4px;
            border-top: 1px solid rgba(196, 113, 74, 0.12);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 12px;
        }

        .chat-title-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-title {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .chat-subtitle {
            color: var(--text-light);
            font-size: 10px;
            line-height: 1.45;
        }

        .chat-count {
            color: var(--text-light);
            font-size: 11px;
            white-space: nowrap;
            padding-top: 2px;
        }

        .chat-history {
            min-height: 150px;
            max-height: none;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 8px 12px 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 240, 231, 0.92));
            border: 1px solid rgba(196, 113, 74, 0.18);
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), 0 6px 16px rgba(44, 36, 32, 0.04);
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: rgba(196, 113, 74, 0.08);
            border-radius: 999px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(196, 113, 74, 0.24);
            border-radius: 999px;
        }

        .empty-chat {
            color: var(--text-light);
            background: linear-gradient(180deg, #ffffff, #f8f0e7);
            border: 1px dashed rgba(196, 113, 74, 0.28);
            border-radius: 16px;
            padding: 12px;
            line-height: 1.5;
            font-size: 12px;
            text-align: center;
        }

        .message-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dark);
            background: linear-gradient(180deg, #ffffff, var(--terracotta-pale));
            overflow: hidden;
            border: 1px solid rgba(196, 113, 74, 0.18);
            box-shadow: 0 3px 8px rgba(44, 36, 32, 0.08);
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-main {
            max-width: min(88%, 680px);
        }

        .message-row.user .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message-row.assistant .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-light);
            margin-bottom: 3px;
            padding: 0 2px;
        }

        .message-bubble {
            width: fit-content;
            max-width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            line-height: 1.45;
            font-size: 13px;
            color: var(--text-dark);
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 10px rgba(44, 36, 32, 0.06);
        }

        .message-row.user .message-bubble {
            background: linear-gradient(180deg, #f7e4d7, var(--terracotta-pale));
            color: #8b4d31;
            border-top-right-radius: 6px;
        }

        .message-row.assistant .message-bubble {
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border-top-left-radius: 6px;
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 48px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--terracotta);
            animation: blink 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        .message-text {
            display: block;
        }

        .metrics {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 8px;
        }

        .metric {
            padding: 5px 10px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.1);
            border-radius: 10px;
            text-align: center;
            min-width: 54px;
        }

        .metric .value {
            font-size: 13px;
            font-weight: 700;
            color: var(--terracotta);
        }

        .metric .label {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; }
            40% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 1320px) {
            .main-layout {
                grid-template-columns: minmax(0, 1.22fr) minmax(340px, 0.95fr);
            }

            .video-container {
                width: min(100%, calc((100vh - 340px) * 16 / 9));
            }
        }

        @media (max-width: 1200px) {
            body {
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: calc(100vh - 32px);
                overflow: visible;
                padding: 20px;
            }

            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }

            .video-shell {
                flex: none;
            }

            .video-container {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
                overflow: auto;
            }

            .container {
                padding: 16px;
                height: auto;
                border-radius: 24px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 16px;
            }

            .main-layout {
                gap: 16px;
            }

            .left-panel,
            .right-panel {
                padding: 16px;
                border-radius: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .avatar-item {
                width: 84px;
            }

            .message-bubble {
                max-width: 100%;
            }
        }

        /* ===== History Panel ===== */
        .panel-menu-row {
            position: absolute;
            top: 18px;
            right: 22px;
            z-index: 30;
        }

        .panel-menu-trigger {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(196, 113, 74, 0.16);
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            color: var(--text-mid);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(44, 36, 32, 0.08);
            transition: all 0.22s ease;
        }

        .panel-menu-trigger:hover,
        .panel-menu-trigger.active {
            color: var(--terracotta);
            border-color: rgba(196, 113, 74, 0.32);
            background: linear-gradient(180deg, #fff9f5, var(--terracotta-pale));
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(196, 113, 74, 0.14);
        }

        .panel-menu-trigger span {
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
        }

        .panel-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 188px;
            padding: 8px;
            border: 1px solid rgba(196, 113, 74, 0.16);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 42px rgba(44, 36, 32, 0.16);
            backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
        }

        .panel-menu-dropdown.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .panel-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .panel-menu-item:hover {
            background: var(--cream-2);
            color: var(--terracotta);
        }

        .panel-menu-item.active {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            box-shadow: 0 8px 18px rgba(196, 113, 74, 0.16);
        }

        .history-btn-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-btn {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1.5px solid var(--terracotta);
            border-radius: 10px;
            background: transparent;
            color: var(--terracotta);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .history-btn:hover {
            background: var(--terracotta);
            color: #fff;
        }
        .history-btn svg {
            flex-shrink: 0;
        }

        #history-overlay {
            position: fixed;
            inset: 0;
            z-index: 1001;
            background: rgba(44, 36, 32, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #history-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        #history-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 420px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-left: 1px solid var(--border);
            box-shadow: -8px 0 32px rgba(44, 36, 32, 0.12);
            backdrop-filter: blur(18px);
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        #history-overlay.open #history-panel {
            transform: translateX(0);
        }

        .history-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
        }
        .history-panel-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
        }
        .history-close-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-mid);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .history-close-btn:hover {
            background: var(--cream-2);
            color: var(--terracotta);
        }

        .history-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
        }
        .history-tab {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            border: none;
            background: transparent;
            cursor: pointer;
            border-bottom: 2.5px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .history-tab:hover {
            color: var(--text-mid);
        }
        .history-tab.active {
            color: var(--terracotta);
            border-bottom-color: var(--terracotta);
        }

        .history-tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .history-tab-content.active {
            display: flex;
        }

        .history-session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .history-session-list::-webkit-scrollbar { width: 5px; }
        .history-session-list::-webkit-scrollbar-thumb { background: rgba(196, 113, 74, 0.2); border-radius: 3px; }

        .history-empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-light);
            font-size: 13px;
        }
        .history-empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .history-session-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .history-session-item:hover {
            background: var(--cream-2);
        }
        .history-session-item.current {
            background: rgba(196, 113, 74, 0.08);
            border: 1px solid rgba(196, 113, 74, 0.15);
        }
        .history-session-info {
            flex: 1;
            min-width: 0;
        }
        .history-session-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-session-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-light);
        }
        .history-session-badge {
            background: var(--terracotta-pale);
            color: var(--terracotta);
            padding: 1px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .history-session-delete {
            opacity: 0;
            border: none;
            background: transparent;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .history-session-item:hover .history-session-delete {
            opacity: 1;
        }
        .history-session-delete:hover {
            background: rgba(214, 107, 94, 0.12);
            color: var(--danger);
        }

        /* Session Detail View */
        .history-detail {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .history-detail.active {
            display: flex;
        }
        .history-detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .history-back-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 8px;
            background: var(--cream-2);
            color: var(--text-mid);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .history-back-btn:hover {
            background: var(--cream-3);
            color: var(--terracotta);
        }
        .history-detail-title {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-detail-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .history-detail-messages::-webkit-scrollbar { width: 5px; }
        .history-detail-messages::-webkit-scrollbar-thumb { background: rgba(196, 113, 74, 0.2); border-radius: 3px; }

        .history-detail-msg {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .history-detail-msg.user {
            flex-direction: row-reverse;
        }
        .history-detail-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--cream-3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-mid);
            flex-shrink: 0;
            overflow: hidden;
        }
        .history-detail-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .history-detail-msg.user .history-detail-avatar {
            background: var(--terracotta-pale);
            color: var(--terracotta);
        }
        .history-detail-bubble {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }
        .history-detail-msg.assistant .history-detail-bubble {
            background: var(--cream-2);
            color: var(--text-dark);
        }
        .history-detail-msg.user .history-detail-bubble {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
        }
        .history-detail-time {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 3px;
        }
        .history-detail-msg.user .history-detail-time {
            text-align: right;
        }

        .history-detail-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .history-restore-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .history-restore-btn:hover {
            box-shadow: 0 4px 16px rgba(196, 113, 74, 0.35);
            transform: translateY(-1px);
        }

        /* Agent Task Items */
        .history-agent-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .history-agent-list::-webkit-scrollbar { width: 5px; }
        .history-agent-list::-webkit-scrollbar-thumb { background: rgba(196, 113, 74, 0.2); border-radius: 3px; }

        .history-agent-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            transition: all 0.2s ease;
            background: #fff;
        }
        .history-agent-item:hover {
            box-shadow: 0 4px 14px rgba(44, 36, 32, 0.07);
        }
        .history-agent-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--cream-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .history-agent-info {
            flex: 1;
            min-width: 0;
        }
        .history-agent-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }
        .history-agent-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-light);
        }
        .history-agent-status {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .history-agent-status.status-done {
            background: var(--sage-pale);
            color: var(--sage);
        }
        .history-agent-status.status-run {
            background: rgba(213, 154, 58, 0.12);
            color: var(--warning);
        }
        .history-agent-summary {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.5;
        }
        .history-agent-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: var(--terracotta);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .history-agent-link:hover {
            text-decoration: underline;
        }

        /* Agent task detail view */
        .history-agent-detail {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .history-agent-detail.active {
            display: flex;
        }
        .history-agent-detail-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .history-agent-detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .history-agent-detail-content::-webkit-scrollbar { width: 5px; }
        .history-agent-detail-content::-webkit-scrollbar-thumb { background: rgba(196, 113, 74, 0.2); border-radius: 3px; }

        /* exec-card styles (adapted from xinyu_complete.html) */
        .exec-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(44,36,32,0.08);
            overflow: hidden;
        }
        .exec-card + .exec-card { margin-top: 12px; }
        .exec-card-head {
            padding: 14px 18px;
            background: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .exec-task-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); }
        .exec-badge { font-size: 10px; padding: 3px 8px; border-radius: 99px; }
        .exec-steps {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .step-row { display: flex; gap: 12px; align-items: flex-start; }
        .step-num {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .step-done { background: rgba(122,158,142,.15); color: var(--sage); }
        .step-run { background: rgba(196,113,94,.15); color: var(--terracotta); animation: stepPulse 1s infinite; }
        .step-pending { background: var(--cream-2); color: var(--text-light); }
        @keyframes stepPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .step-name { font-size: 13px; font-weight: 500; color: var(--text-dark); margin-bottom: 2px; }
        .step-desc { font-size: 11.5px; color: var(--text-mid); }

        .log-area {
            margin: 0 18px 16px;
            max-height: 220px;
            overflow: auto;
            background:
                radial-gradient(circle at top right, rgba(122,198,123,.08), transparent 28%),
                linear-gradient(180deg, #07120f, #0a1713 48%, #0d1d18);
            border: 1px solid rgba(112, 219, 171, .14);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: rgba(208,255,226,.78);
            line-height: 1.7;
            box-shadow: inset 0 0 0 1px rgba(112, 219, 171, .05);
        }
        .log-line { display: flex; gap: 8px; align-items: flex-start; }
        .log-time { color: rgba(174,255,214,.52); flex-shrink: 0; }
        .log-badge {
            min-width: 46px;
            display: inline-flex; justify-content: center;
            padding: 1px 7px; border-radius: 999px;
            border: 1px solid currentColor;
            font-size: 10px; line-height: 1.4; letter-spacing: .04em;
        }
        .log-text { flex: 1; color: rgba(220,255,234,.92); word-break: break-word; }
        .log-ok { color: #7BC67B; }
        .log-run-badge { color: #F4C6AE; }
        .log-dom { color: #98F7BF; }
        .log-data { color: #FFD777; }
        .log-hit { color: #E7A3FF; }

        .exec-badge.status-run {
            background: rgba(250,204,21,0.2);
            color: #facc15;
        }
        .exec-badge.status-done {
            background: rgba(74,222,128,0.2);
            color: #4ade80;
        }

        .exec-card-success {
            background: linear-gradient(180deg, rgba(212,240,234,.72), rgba(255,255,255,.98) 38%);
            border: 1px solid rgba(74,158,138,.24);
            box-shadow: 0 18px 42px rgba(74,158,138,.16);
        }
        .exec-card-success .exec-card-head {
            background: linear-gradient(135deg, #17342d, #275c4f 70%, #347665);
        }
        .status-ticket-success {
            background: rgba(212,240,234,.95);
            color: #1c5a4a;
            box-shadow: inset 0 0 0 1px rgba(74,158,138,.18);
        }
        .exec-receipt {
            margin: 0 18px 18px;
            padding: 16px 18px;
            border-radius: 16px;
            background:
                radial-gradient(circle at top right, rgba(122,196,176,.16), transparent 30%),
                linear-gradient(135deg, rgba(255,255,255,.98), rgba(212,240,234,.9));
            border: 1px solid rgba(74,158,138,.18);
            box-shadow: 0 12px 28px rgba(74,158,138,.12);
        }
        .exec-receipt-head {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 12px; margin-bottom: 14px;
        }
        .exec-receipt-title { font-size: 14px; font-weight: 700; color: var(--text-dark); }
        .exec-receipt-subtitle { margin-top: 4px; font-size: 11.5px; color: var(--text-mid); }
        .exec-receipt-price { font-size: 20px; font-weight: 800; color: #4a9e8a; white-space: nowrap; }
        .exec-receipt-route {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 14px; border-radius: 14px;
            background: rgba(255,255,255,.78); border: 1px dashed rgba(74,158,138,.24);
        }
        .exec-receipt-station { flex: 1; }
        .exec-receipt-station strong { display: block; font-size: 18px; font-weight: 800; color: var(--text-dark); }
        .exec-receipt-station span { display: block; margin-top: 3px; font-size: 11px; color: var(--text-mid); }
        .exec-receipt-arrow { font-size: 18px; color: #4a9e8a; opacity: .8; }
        .exec-receipt-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px; margin-top: 12px;
        }
        .exec-receipt-item { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.7); }
        .exec-receipt-label { font-size: 10.5px; letter-spacing: .08em; color: var(--text-mid); text-transform: uppercase; }
        .exec-receipt-value { margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--text-dark); }
        .exec-receipt-foot {
            margin-top: 12px; padding-top: 10px;
            border-top: 1px dashed rgba(74,158,138,.18);
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
        }
        .exec-receipt-note { font-size: 11px; color: var(--text-mid); }
        .exec-receipt-order { font-size: 11px; font-weight: 700; color: #4a9e8a; }

        @media (max-width: 640px) {
            #history-panel {
                width: 100%;
            }
            .panel-menu-row {
                top: 12px;
                right: 12px;
            }
            .panel-menu-dropdown {
                min-width: min(220px, calc(100vw - 64px));
            }
            .history-btn span {
                display: none;
            }
            #emotion-input.active {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            #emotion-input.active .camera-section,
            #emotion-input.active .emotion-display,
            #emotion-input.active .emotion-scores,
            #emotion-input.active .emotion-controls {
                grid-column: 1;
                grid-row: auto;
            }
            #tongue-input.active {
                gap: 10px;
            }
            #tongue-input.active .tongue-camera-section,
            #tongue-input.active .tongue-guide,
            #tongue-input.active .tongue-status,
            #tongue-input.active .tongue-result {
                width: 100%;
            }
            .tongue-result-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 双模式切换 ===== */
        .mode-switcher {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(196, 113, 74, 0.2);
            background: transparent;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .mode-btn:hover {
            background: var(--cream-2);
            color: var(--text-mid);
            border-color: rgba(196, 113, 74, 0.3);
        }

        .mode-btn.active {
            background: rgba(196, 113, 74, 0.1);
            border-color: rgba(196, 113, 74, 0.4);
            color: var(--terracotta);
            font-weight: 600;
        }

        .mode-btn.active.agent-mode {
            background: rgba(122, 158, 135, 0.1);
            border-color: rgba(122, 158, 135, 0.35);
            color: var(--sage);
        }

        /* Agent 步骤消息气泡 */
        .message-row.agent-step .message-bubble {
            background: rgba(122, 158, 135, 0.06);
            border: 1px dashed rgba(122, 158, 135, 0.3);
            color: var(--sage);
            font-size: 12px;
        }

        /* Agent 订单回执卡片 */
        .agent-receipt-card {
            margin: 6px 0;
            padding: 12px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(122, 158, 135, 0.08), rgba(122, 158, 135, 0.04));
            border: 1px solid rgba(122, 158, 135, 0.2);
            box-shadow: 0 4px 10px rgba(44, 36, 32, 0.05);
        }

        .agent-receipt-card .receipt-route {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .agent-receipt-card .receipt-route .arrow {
            color: var(--sage);
        }

        .agent-receipt-card .receipt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
        }

        .agent-receipt-card .receipt-grid > div {
            font-size: 12px;
        }

        .agent-receipt-card .receipt-grid label {
            color: var(--text-light);
            margin-right: 3px;
        }

        .agent-receipt-card .receipt-grid span {
            color: var(--text-dark);
            font-weight: 600;
        }

        .agent-receipt-card .receipt-order-no {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-light);
            border-top: 1px dashed rgba(122, 158, 135, 0.2);
            padding-top: 6px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ===== Agent 动作面板 ===== */
        .agent-action-panel {
            margin-top: 10px;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.18);
            box-shadow: 0 4px 12px rgba(44, 36, 32, 0.07);
            animation: slideIn 0.2s ease;
        }

        .agent-action-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .agent-intent-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .agent-intent-grid label { color: var(--text-light); margin-right: 4px; }
        .agent-intent-grid span  { color: var(--text-dark);  font-weight: 600; }

        .agent-action-note {
            font-size: 12px;
            color: var(--text-mid);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .agent-action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .agent-action-btns .btn-primary  { padding: 7px 18px; font-size: 13px; }
        .agent-action-btns .btn-secondary { padding: 7px 14px; font-size: 13px; }

        .agent-candidate-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            max-height: 220px;
            overflow-y: auto;
        }

        .agent-candidate-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(196, 113, 74, 0.15);
            background: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .agent-candidate-item:hover  {
            border-color: rgba(196, 113, 74, 0.35);
            background: var(--terracotta-pale);
        }

        .agent-candidate-item.selected {
            border-color: var(--terracotta);
            background: rgba(196, 113, 74, 0.07);
        }

        .candidate-train-no {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-dark);
            min-width: 52px;
        }

        .candidate-times {
            flex: 1;
            color: var(--text-mid);
        }

        .candidate-duration { color: var(--text-light); font-size: 11px; min-width: 40px; }
        .candidate-badge    { font-size: 10px; color: var(--terracotta); background: var(--terracotta-pale); padding: 1px 6px; border-radius: 8px; }

        .candidate-seat-select {
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(196, 113, 74, 0.2);
            background: #fff;
            font-size: 11px;
            color: var(--text-dark);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 历史记录面板 -->
    <div id="history-overlay" onclick="if(event.target===this)closeHistoryPanel()">
        <div id="history-panel">
            <div class="history-panel-header">
                <h3>历史记录</h3>
                <button class="history-close-btn" onclick="closeHistoryPanel()">&times;</button>
            </div>
            <div class="history-tabs">
                <button class="history-tab active" onclick="switchHistoryTab('chat',this)">对话历史</button>
                <button class="history-tab" onclick="switchHistoryTab('agent',this)">Agent任务</button>
            </div>
            <div class="history-tab-content active" id="history-chat-tab">
                <div class="history-session-list" id="history-session-list"></div>
                <div class="history-detail" id="history-detail">
                    <div class="history-detail-header">
                        <button class="history-back-btn" onclick="backToSessionList()">&#8592;</button>
                        <div class="history-detail-title" id="history-detail-title"></div>
                    </div>
                    <div class="history-detail-messages" id="history-detail-messages"></div>
                    <div class="history-detail-actions">
                        <button class="history-restore-btn" id="history-restore-btn" onclick="restoreCurrentDetailSession()">恢复此对话</button>
                    </div>
                </div>
            </div>
            <div class="history-tab-content" id="history-agent-tab">
                <div class="history-agent-list" id="history-agent-list"></div>
                <div class="history-agent-detail" id="history-agent-detail">
                    <div class="history-agent-detail-header">
                        <button class="history-back-btn" onclick="backToAgentList()">&#8592;</button>
                        <div class="history-detail-title" id="history-agent-detail-title"></div>
                    </div>
                    <div class="history-agent-detail-content" id="history-agent-detail-content"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>数字人对话系统</h1>

        <div class="panel-menu-row" id="panel-menu-row">
            <button class="panel-menu-trigger" id="panel-menu-trigger" type="button" onclick="togglePanelMenu(event)" aria-label="打开功能菜单" aria-expanded="false" aria-controls="panel-menu-dropdown">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="panel-menu-dropdown" id="panel-menu-dropdown" role="menu" aria-hidden="true">
                <button class="panel-menu-item" type="button" role="menuitem" onclick="navigateFromPanelMenu('home')">首页</button>
                <button class="panel-menu-item active" type="button" role="menuitem" onclick="navigateFromPanelMenu('chat')">💬 陪伴对话</button>
                <button class="panel-menu-item" type="button" role="menuitem" onclick="navigateFromPanelMenu('hardware')">🛡️ 健康守护</button>
                <button class="panel-menu-item" type="button" role="menuitem" onclick="navigateFromPanelMenu('report')">📊 情绪报告</button>
                <button class="panel-menu-item" type="button" role="menuitem" onclick="navigateFromPanelMenu('profile')">👤 个人中心</button>
            </div>
        </div>

        <div class="main-layout">
            <section class="left-panel">
                <div class="video-shell">
                    <div class="video-container" id="video-container">
                        <div class="video-overlay" id="video-overlay">
                            <div class="icon">🎬</div>
                            <div>加载中...</div>
                        </div>
                        <canvas id="render-canvas"></canvas>
                        <video id="idle-video" muted playsinline preload="auto"></video>
                        <video id="idle-video-2" muted playsinline preload="auto"></video>
                        <video id="response-video" playsinline></video>
                    </div>
                </div>

                <div class="metrics" id="metrics">
                    <div class="metric">
                        <div class="value" id="metric-total">--</div>
                        <div class="label">总耗时</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="metric-llm">--</div>
                        <div class="label">LLM</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="metric-tts">--</div>
                        <div class="label">TTS</div>
                    </div>
                    <div class="metric">
                        <div class="value" id="metric-video">--</div>
                        <div class="label">视频</div>
                    </div>
                </div>

                <div>
                    <div class="section-title">选择数字人</div>
                    <div class="avatar-list" id="avatar-list"></div>
                </div>
            </section>

            <section class="right-panel">
                <div class="history-btn-wrap">
                    <div class="mode-switcher" id="modeSwitcher">
                        <button class="mode-btn active" id="btnChatMode" onclick="switchMode('chat')">💬 对话模式</button>
                        <button class="mode-btn" id="btnAgentMode" onclick="switchMode('agent')">🦞 Agent 模式</button>
                    </div>
                    <button class="history-btn" onclick="toggleHistoryPanel()" title="历史记录">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span>历史记录</span>
                    </button>
                </div>
                <div class="status-bar ready" id="status-bar">
                    <div class="status-text">准备就绪</div>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                </div>

                <div class="chat-section">
                    <div class="chat-header">
                        <div class="chat-title-wrap">
                            <div class="chat-title">当前会话</div>
                        </div>
                        <div class="chat-count" id="chat-count">0 条消息</div>
                    </div>
                    <div class="chat-history" id="chat-history">
                        <!-- Agent 动作面板：根据任务状态动态渲染，放在滚动区内避免遮挡输入框 -->
                        <div id="agentActionPanel" class="agent-action-panel" style="display:none;"></div>
                    </div>

                    <div class="input-tab-content" id="tongue-input">
                        <div class="camera-section tongue-camera-section">
                            <video id="tongue-camera" autoplay playsinline muted></video>
                            <div class="camera-label">舌诊预览</div>
                            <div class="camera-overlay" id="tongue-camera-overlay">
                                <div class="icon">👅</div>
                                <div>点击“开始诊断”后显示预览</div>
                            </div>
                        </div>

                        <div class="tongue-guide" id="tongue-guide">请伸出舌头对准摄像头，确认后请点击“进行诊断”</div>
                        <div class="tongue-status" id="tongue-status">未开始</div>

                        <div class="tongue-result hidden" id="tongue-result">
                            <div class="tongue-result-grid">
                                <div class="tongue-result-item">
                                    <div class="tongue-result-label">舌色</div>
                                    <div class="tongue-result-value" id="tongue-color-value">--</div>
                                </div>
                                <div class="tongue-result-item">
                                    <div class="tongue-result-label">苔色</div>
                                    <div class="tongue-result-value" id="tongue-coat-value">--</div>
                                </div>
                                <div class="tongue-result-item">
                                    <div class="tongue-result-label">厚薄</div>
                                    <div class="tongue-result-value" id="tongue-thickness-value">--</div>
                                </div>
                                <div class="tongue-result-item">
                                    <div class="tongue-result-label">腻腐</div>
                                    <div class="tongue-result-value" id="tongue-greasiness-value">--</div>
                                </div>
                            </div>
                            <div class="tongue-result-tip" id="tongue-result-tip">本次结果仅供辅助参考</div>
                        </div>
                    </div>
                </div>

                <div class="input-tabs">
                    <div class="input-tab active" data-tab="text">文字输入</div>
                    <div class="input-tab" data-tab="voice">语音输入</div>
                    <div class="input-tab" data-tab="emotion">情绪感知</div>
                    <div class="input-tab" data-tab="tongue">舌诊</div>
                </div>

                <div class="input-tab-content active" id="text-input">
                    <textarea id="user-text" placeholder="请输入您想问的问题..."></textarea>
                </div>

                <div class="input-tab-content" id="voice-input">
                    <div class="audio-record-section">
                        <div class="record-btn" id="record-btn">
                            <div class="record-icon"></div>
                        </div>
                        <div class="record-hint" id="record-hint">点击开始录音</div>
                        <div class="audio-preview" id="audio-preview">
                            <audio id="recorded-audio" controls></audio>
                        </div>
                    </div>
                </div>

                <div class="input-tab-content" id="emotion-input">
                    <!-- 摄像头预览 -->
                    <div class="camera-section">
                        <video id="emotion-camera" autoplay playsinline muted></video>
                        <div class="camera-label">你的表情</div>
                        <div class="camera-overlay" id="camera-overlay">
                            <div class="icon">📷</div>
                            <div>启用后显示预览</div>
