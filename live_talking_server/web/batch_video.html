<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人对话系统 - 批量视频生成</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #faf6f1;
            --cream-2: #f3ece2;
            --cream-3: #eadfd2;
            --terracotta: #c4714a;
            --terracotta-light: #e8a07a;
            --terracotta-pale: #f2d5c5;
            --sage: #7a9e87;
            --sage-pale: #deeee3;
            --lavender: #9b8bb4;
            --text-dark: #2c2420;
            --text-mid: #6b5b52;
            --text-light: #a09080;
            --panel-bg: rgba(255, 255, 255, 0.86);
            --border: rgba(196, 113, 74, 0.14);
            --primary: var(--terracotta);
            --primary-2: #de8f67;
            --success: #6f977b;
            --warning: #d59a3a;
            --danger: #d66b5e;
            --shadow-soft: 0 18px 48px rgba(44, 36, 32, 0.12);
            --shadow-card: 0 10px 30px rgba(44, 36, 32, 0.1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(232, 160, 122, 0.22), transparent 34%),
                radial-gradient(circle at top right, rgba(155, 139, 180, 0.16), transparent 30%),
                linear-gradient(180deg, #fcf8f3 0%, #f6ede3 100%);
            min-height: 100vh;
            color: var(--text-dark);
            padding: 84px 16px 16px;
            overflow: hidden;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(250, 246, 241, 0.94);
            border-bottom: 1px solid rgba(196, 113, 74, 0.12);
            box-shadow: 0 10px 28px rgba(44, 36, 32, 0.08);
            backdrop-filter: blur(18px);
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--terracotta);
            letter-spacing: 2px;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .nav-logo span {
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0;
            margin-left: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .nav-links button {
            flex: 0 0 auto;
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 500;
            box-shadow: none;
        }

        .nav-links button:hover:not(.active) {
            background: var(--cream-2);
            color: var(--terracotta);
            transform: translateY(-1px);
        }

        .nav-links button.active {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            box-shadow: 0 10px 24px rgba(196, 113, 74, 0.2);
        }

        @media (max-width: 1100px) {
            body {
                padding-top: 122px;
            }

            .container {
                height: calc(100vh - 138px);
            }

            .nav {
                height: auto;
                min-height: 64px;
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .nav-logo {
                text-align: center;
            }

            .nav-links {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
            }
        }

        .container {
            position: relative;
            max-width: 1600px;
            height: calc(100vh - 100px);
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.74));
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 30px;
            padding: 24px 26px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 180px;
            background: linear-gradient(135deg, rgba(232, 160, 122, 0.16), rgba(122, 158, 135, 0.08) 56%, rgba(155, 139, 180, 0.1));
            pointer-events: none;
        }

        h1 {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 18px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-dark);
        }

        h1::after {
            content: '';
            display: block;
            width: 88px;
            height: 4px;
            margin: 12px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(196, 113, 74, 0.12), var(--terracotta), rgba(122, 158, 135, 0.22));
        }

        .main-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(680px, 1.48fr) minmax(360px, 0.92fr);
            gap: 20px;
            align-items: stretch;
            height: calc(100% - 74px);
            min-height: 0;
        }

        .left-panel,
        .right-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            min-height: 0;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(8px);
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-title {
            margin-bottom: 10px;
            color: var(--text-mid);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .avatar-list {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2px;
        }

        .avatar-item {
            width: 98px;
            cursor: pointer;
            border-radius: 18px;
            padding: 12px 10px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.12);
            box-shadow: 0 6px 16px rgba(44, 36, 32, 0.06);
            transition: all 0.25s ease;
            text-align: center;
        }

        .avatar-item:hover {
            background: linear-gradient(180deg, #ffffff, #f7ece4);
            border-color: rgba(196, 113, 74, 0.24);
            box-shadow: 0 12px 24px rgba(196, 113, 74, 0.14);
            transform: translateY(-3px);
        }

        .avatar-item.active {
            border-color: var(--terracotta);
            background: linear-gradient(180deg, #fff7f1, var(--terracotta-pale));
            box-shadow: 0 12px 28px rgba(196, 113, 74, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        .avatar-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 8px;
            object-fit: cover;
            border: 2px solid rgba(196, 113, 74, 0.22);
            background: var(--cream-2);
        }

        .avatar-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 情绪感知样式 */
        .camera-section {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 4 / 3;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1816;
            border: 1px solid rgba(196, 113, 74, 0.16);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            margin: 0 auto 12px;
        }

        #emotion-camera {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 1;
            object-fit: cover;
            background: #201c19;
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            left: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(44, 36, 32, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 4px 10px;
            border-radius: 999px;
            z-index: 3;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(32, 27, 24, 0.72), rgba(32, 27, 24, 0.88));
            color: rgba(255, 255, 255, 0.86);
            font-size: 14px;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .camera-overlay .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .emotion-display {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .emotion-icon {
            font-size: 1.8rem;
            margin-right: 10px;
            min-width: 34px;
            text-align: center;
        }

        .emotion-text {
            font-size: 0.98rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .emotion-scores {
            margin-bottom: 12px;
        }

        .emotion-score-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .emotion-score-name {
            width: 52px;
            color: var(--text-mid);
            font-size: 13px;
            font-weight: 600;
        }

        .emotion-score-bar {
            flex: 1;
            height: 7px;
            background: var(--cream-3);
            border-radius: 999px;
            margin: 0 8px;
            overflow: hidden;
        }

        .emotion-score-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .emotion-score-value {
            width: 42px;
            text-align: right;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
        }

        .emotion-controls {
            padding: 12px 14px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
        }

        .emotion-action-group {
            display: none;
        }

        .emotion-action-group:not(.hidden) {
            display: block;
        }

        .hold-to-talk-btn {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: 0 14px 28px rgba(196, 113, 74, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            user-select: none;
            touch-action: none;
        }

        .hold-to-talk-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(196, 113, 74, 0.28);
        }

        .hold-to-talk-btn.recording {
            background: linear-gradient(135deg, #c95e56, #e58a7f);
            box-shadow: 0 18px 34px rgba(201, 94, 86, 0.3);
        }

        .hold-to-talk-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .switch-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
        }

        .switch-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--terracotta);
        }

        .emotion-status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-light);
        }

        .video-shell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            width: 100%;
        }

        .video-container {
            position: relative;
            width: min(100%, calc((100vh - 310px) * 16 / 9));
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border-radius: 26px;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1916 0%, #0f0d0c 100%);
            border: 1px solid rgba(196, 113, 74, 0.12);
            box-shadow: 0 24px 52px rgba(44, 36, 32, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .video-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        #render-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }

        #idle-video,
        #idle-video-2,
        #response-video {
            display: none;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.78);
            font-size: 18px;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.04), transparent 36%),
                linear-gradient(180deg, rgba(18, 15, 13, 0.84), rgba(18, 15, 13, 0.96));
        }

        .video-overlay .icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .status-bar {
            margin-bottom: 0;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.1);
            box-shadow: 0 8px 20px rgba(44, 36, 32, 0.06);
            color: var(--text-dark);
        }

        .status-bar.ready { background: linear-gradient(180deg, #f3fbf6, var(--sage-pale)); color: var(--sage); }
        .status-bar.processing { background: linear-gradient(180deg, #fff6ef, #fde5d7); color: var(--terracotta); }
        .status-bar.success { background: linear-gradient(180deg, #f3fbf6, var(--sage-pale)); color: var(--success); }
        .status-bar.error { background: linear-gradient(180deg, #fff2ef, #ffe1da); color: #c95e56; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(196, 113, 74, 0.12);
            border-radius: 999px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active { display: block; }

        .progress {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--terracotta-light), var(--terracotta));
            transition: width 0.3s ease;
        }

        .input-tabs {
            display: flex;
            margin-bottom: 14px;
            background: linear-gradient(180deg, #faf4ed, #f1e7dc);
            border: 1px solid rgba(196, 113, 74, 0.08);
            border-radius: 16px;
            padding: 6px;
        }

        .input-tab {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-mid);
        }

        .input-tab.active {
            background: rgba(255, 255, 255, 0.94);
            color: var(--terracotta);
            box-shadow: 0 6px 16px rgba(44, 36, 32, 0.08);
        }

        .input-tab-content { display: none; }
        .input-tab-content.active { display: block; }

        textarea {
            width: 100%;
            min-height: 96px;
            padding: 16px;
            border: 1px solid #e7d8ca;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--text-dark);
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--terracotta);
            box-shadow: 0 0 0 4px rgba(196, 113, 74, 0.1);
        }

        textarea::placeholder {
            color: var(--text-light);
        }

        .audio-record-section {
            text-align: center;
            padding: 18px 14px 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            border: 1px solid rgba(196, 113, 74, 0.1);
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(196, 113, 74, 0.24);
            background: linear-gradient(180deg, #ffffff, #fbf4ed);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 18px rgba(44, 36, 32, 0.08);
        }

        .record-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(196, 113, 74, 0.16);
        }

        .record-btn.recording {
            border-color: var(--terracotta);
            background: linear-gradient(180deg, #fff0e7, #f6d3c1);
            animation: pulse 1s infinite;
        }

        .record-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--terracotta);
        }

        .record-btn.recording .record-icon {
            width: 24px;
            height: 24px;
            border-radius: 5px;
        }

        .record-hint {
            color: var(--text-mid);
            font-size: 14px;
        }

        .audio-preview {
            margin-top: 16px;
            display: none;
        }

        .audio-preview audio {
            width: 100%;
            max-width: 320px;
            accent-color: var(--terracotta);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }

        .button-group.hidden,
        .emotion-action-group.hidden {
            display: none;
        }

        button {
            flex: 1;
            padding: 13px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-light));
            color: #fff;
            box-shadow: 0 12px 26px rgba(196, 113, 74, 0.22);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(196, 113, 74, 0.28);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #ffffff, var(--cream-2));
            color: var(--text-dark);
            border: 1px solid rgba(196, 113, 74, 0.12);
        }

        .btn-secondary:hover:not(:disabled) {
            background: linear-gradient(180deg, #fff9f5, var(--terracotta-pale));
            color: var(--terracotta);
        }

        .chat-section {
            margin-top: 4px;
            border-top: 1px solid rgba(196, 113, 74, 0.12);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 12px;
        }

        .chat-title-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-title {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .chat-subtitle {
            color: var(--text-light);
            font-size: 10px;
            line-height: 1.45;
        }

        .chat-count {
            color: var(--text-light);
            font-size: 11px;
            white-space: nowrap;
            padding-top: 2px;
        }

        .chat-history {
            min-height: 150px;
            max-height: none;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: rgba(196, 113, 74, 0.08);
            border-radius: 999px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(196, 113, 74, 0.24);
            border-radius: 999px;
        }

        .empty-chat {
            color: var(--text-light);
            background: linear-gradient(180deg, #ffffff, #f8f0e7);
            border: 1px dashed rgba(196, 113, 74, 0.28);
            border-radius: 16px;
            padding: 12px;
            line-height: 1.5;
            font-size: 12px;
            text-align: center;
        }

        .message-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dark);
            background: linear-gradient(180deg, #ffffff, var(--terracotta-pale));
            overflow: hidden;
            border: 1px solid rgba(196, 113, 74, 0.18);
            box-shadow: 0 3px 8px rgba(44, 36, 32, 0.08);
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-main {
            max-width: min(88%, 680px);
        }

        .message-row.user .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message-row.assistant .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-light);
            margin-bottom: 3px;
            padding: 0 2px;
        }

        .message-bubble {
            width: fit-content;
            max-width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            line-height: 1.45;
            font-size: 13px;
            color: var(--text-dark);
            white-space: pre-wrap;

        function initCanvasRenderer() {
            ctx = elements.renderCanvas.getContext('2d');
            resizeCanvasToContainer();
            state.offscreenCanvas = document.createElement('canvas');
            state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            syncOffscreenCanvas();
            startRenderLoop();
            window.addEventListener('resize', resizeCanvasToContainer);
        }

        function resizeCanvasToContainer() {
            const rect = elements.videoContainer.getBoundingClientRect();
            const nextWidth = Math.max(1, Math.floor(rect.width || canvasWidth));
            const nextHeight = Math.max(1, Math.floor(rect.height || canvasHeight));

            if (nextWidth === canvasWidth && nextHeight === canvasHeight) return;

            canvasWidth = nextWidth;
            canvasHeight = nextHeight;
            elements.renderCanvas.width = canvasWidth;
            elements.renderCanvas.height = canvasHeight;
            syncOffscreenCanvas();
        }

        function syncOffscreenCanvas() {
            if (!state.offscreenCanvas) return;
            state.offscreenCanvas.width = canvasWidth;
            state.offscreenCanvas.height = canvasHeight;
        }

        function updateVideoAspectRatio(video) {
            if (video.videoWidth && video.videoHeight) {
                elements.videoContainer.style.aspectRatio = DISPLAY_ASPECT_RATIO_CSS;
                requestAnimationFrame(resizeCanvasToContainer);
            }
        }

        function getCoverDrawRect(videoWidth, videoHeight) {
            const scale = Math.max(canvasWidth / videoWidth, canvasHeight / videoHeight);
            const drawWidth = videoWidth * scale;
            const drawHeight = videoHeight * scale;

            return {
                drawWidth,
                drawHeight,
                dx: (canvasWidth - drawWidth) / 2,
                dy: (canvasHeight - drawHeight) / 2
            };
        }

        function drawVideoContain(video, alpha) {
            if (!video || video.readyState < 2 || alpha <= 0) return false;
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                ctx.globalAlpha = alpha;
                ctx.drawImage(video, dx, dy, drawWidth, drawHeight);
                ctx.globalAlpha = 1;
                return true;
            } catch (e) {
                ctx.globalAlpha = 1;
                return false;
            }
        }

        function startRenderLoop() {
            const render = () => {
                renderFrame();
                state.animationFrameId = requestAnimationFrame(render);
            };
            render();

        function renderFrame() {
            if (!ctx) return;

            // 淡入淡出速度
            const fadeSpeed = 0.08;
            if (state.crossfadeAlpha < state.crossfadeTarget) {
                state.crossfadeAlpha = Math.min(state.crossfadeAlpha + fadeSpeed, state.crossfadeTarget);
            } else if (state.crossfadeAlpha > state.crossfadeTarget) {
                state.crossfadeAlpha = Math.max(state.crossfadeAlpha - fadeSpeed, state.crossfadeTarget);
            }

            const idleFadeSpeed = 0.1;
            if (state.idleCrossfadeAlpha < 1.0 && state.isIdleCrossfading) {
                state.idleCrossfadeAlpha = Math.min(state.idleCrossfadeAlpha + idleFadeSpeed, 1.0);
                if (state.idleCrossfadeAlpha >= 1.0) state.isIdleCrossfading = false;
            }

            // 确保离屏 canvas 存在且尺寸正确
            if (!state.offscreenCanvas) {
                state.offscreenCanvas = document.createElement('canvas');
                state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            }
            if (state.offscreenCanvas.width !== canvasWidth || state.offscreenCanvas.height !== canvasHeight) {
                state.offscreenCanvas.width = canvasWidth;
                state.offscreenCanvas.height = canvasHeight;
            }

            const offCtx = state.offscreenCtx;

            // ========== 清空并填充黑色背景 ==========
            offCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            offCtx.fillStyle = '#140f0c';
            offCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;

            // ========== 绘制 IDLE 层 ==========
            const idleAlpha = state.crossfadeAlpha;
            if (idleAlpha > 0.001) {
                if (state.isIdleCrossfading) {
                    // Crossfade 模式：旧视频淡出，新视频淡入
                    // 帧缓冲作为新视频还没准备好时的兜底

                    // 1. 绘制旧视频/帧缓冲淡出
                    const outAlpha = idleAlpha * (1 - state.idleCrossfadeAlpha);
                    if (outAlpha > 0.01) {
                        // 优先绘制旧视频
                        if (inactiveIdle.readyState >= 2 && inactiveIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, inactiveIdle, outAlpha);
                        } else if (state.idleFrameBuffer) {
                            // 旧视频不可用时用帧缓冲
                            offCtx.globalAlpha = outAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }

                    // 2. 绘制新视频淡入
                    const inAlpha = idleAlpha * state.idleCrossfadeAlpha;
                    if (inAlpha > 0.01) {
                        if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, activeIdle, inAlpha);
                            // 更新帧缓冲为新视频
                            saveFrameBuffer('idle', activeIdle);
                        } else if (state.idleFrameBuffer) {
                            // 新视频不可用时用帧缓冲
                            offCtx.globalAlpha = inAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }
                } else {
                    // 正常模式：帧缓冲打底 + 视频覆盖
                    if (state.idleFrameBuffer) {
                        offCtx.globalAlpha = idleAlpha;
                        offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                        offCtx.globalAlpha = 1;
                    }
                    if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                        drawVideoToContext(offCtx, activeIdle, idleAlpha);
                        saveFrameBuffer('idle', activeIdle);
                    }
                }
            }

            // ========== 绘制 RESPONSE 层 ==========
            const responseAlpha = 1 - state.crossfadeAlpha;
            if (responseAlpha > 0.001) {
                // 帧缓冲打底
                if (state.responseFrameBuffer) {
                    offCtx.globalAlpha = responseAlpha;
                    offCtx.drawImage(state.responseFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                    offCtx.globalAlpha = 1;
                }

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(state.offscreenCanvas, 0, 0);

            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                targetCtx.globalAlpha = alpha;
                targetCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
                targetCtx.globalAlpha = 1;
                return true;
            } catch (e) {
                targetCtx.globalAlpha = 1;
                return false;
            }
        }

            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH || canvasWidth <= 0 || canvasHeight <= 0) return;

            const bufferKey = type + 'FrameBuffer';
            if (!state[bufferKey]) {
                state[bufferKey] = document.createElement('canvas');
            }
            // 确保帧缓冲尺寸与主 canvas 匹配
            if (state[bufferKey].width !== canvasWidth || state[bufferKey].height !== canvasHeight) {
                state[bufferKey].width = canvasWidth;
                state[bufferKey].height = canvasHeight;
            }

            const bufferCtx = state[bufferKey].getContext('2d');
            bufferCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            bufferCtx.fillStyle = '#140f0c';
            bufferCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                bufferCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
            } catch (e) {}
        }

        function switchToResponseVideo() {
            state.crossfadeTarget = 0.0;
        }

        function switchToIdleVideo() {

        function initIdleVideoEvents(video, videoNum) {

            video.addEventListener('timeupdate', () => {
                if (state.showingResponse) return;
                const remainingTime = video.duration - video.currentTime;
                const isActive = state.activeIdleVideo === videoNum;
                if (isActive && remainingTime < IDLE_CROSSFADE_TIME && !state.isIdleCrossfading) {
                    const otherVideo = videoNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    const otherNum = videoNum === 1 ? 2 : 1;
                    if (otherVideo.readyState >= 2) {
                        // 在切换前保存当前帧到缓冲
                        if (video.readyState >= 2 && video.videoWidth > 0) {
                            saveFrameBuffer('idle', video);
                        }
                        state.isIdleCrossfading = true;
                        state.activeIdleVideo = otherNum;
                        // 从 1.0 开始，让新视频逐渐淡入覆盖旧帧
                        state.idleCrossfadeAlpha = 0.0;
                        otherVideo.currentTime = 0;
                        otherVideo.play().catch(() => {});
                    }
                }
            });

            video.addEventListener('ended', () => {
                if (state.showingResponse) return;
                const localNum = video === elements.idleVideo ? 1 : 2;
                if (state.activeIdleVideo !== localNum) {
                    video.currentTime = 0;
                    video.pause();
                } else {
                    const otherVideo = localNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    // 在切换前保存当前帧到缓冲
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        saveFrameBuffer('idle', video);
                    }
                    state.activeIdleVideo = localNum === 1 ? 2 : 1;
                    state.idleCrossfadeAlpha = 0.0;
                    state.isIdleCrossfading = true;
                    otherVideo.currentTime = 0;
                    otherVideo.play().catch(() => {});
                }
            });

            video.addEventListener('pause', () => {
                if (!state.showingResponse && state.activeIdleVideo === videoNum) {
                    video.play().catch(() => {});
                }
            });
        }

            playManagedResponseVideo({

                source: 'emotion-first',

            });

        function onResponseVideoEnded() {
            // 立即保存 response 最后一帧
            if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                saveFrameBuffer('response', elements.responseVideo);
            }

            // idle 帧缓冲在 playResponseVideo 时已保存，这里不需要更新
            // 只需要恢复 idle 视频播放

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.paused) {
                activeIdle.play().catch(() => {});
            }

            state.showingResponse = false;
            switchToIdleVideo();

            const shouldDeleteVideo = state.responsePlayback.deleteAfterPlay && state.responsePlayback.filename;
            if (shouldDeleteVideo) {
                deletePlayedVideo(state.responsePlayback.filename);
            }

            resetResponsePlaybackState();

            if (tryPlayPendingEmotionVideo()) {
                return;
            }

            scheduleResponseCleanup();
            refreshGenerateButtonState();
        }

        function initEmotionTalkButton() {
            const startHold = async (event) => {
                event?.preventDefault();
                if (state.isProcessing || state.isRecording || state.emotionHoldActive) return;

                state.emotionHoldActive = true;
                state.emotionHoldShouldStop = false;
                try {
                    elements.emotionTalkBtn.setPointerCapture?.(event.pointerId);
                } catch (e) {}

                state.emotionHoldStartPromise = startRecording({ mode: 'emotion-hold' });
                const started = await state.emotionHoldStartPromise;
                state.emotionHoldStartPromise = null;

                if (!started) {
                    state.emotionHoldActive = false;
                    state.emotionHoldShouldStop = false;
                    setEmotionTalkButtonState();
                    return;
                }

                if (state.emotionHoldShouldStop) {
                    await finishEmotionHoldRecording(event);
                }
            };

            const stopHold = async (event) => {
                event?.preventDefault();
                if (!state.emotionHoldActive) return;

                state.emotionHoldShouldStop = true;
                if (state.emotionHoldStartPromise) {
                    await state.emotionHoldStartPromise;
                }
                await finishEmotionHoldRecording(event);
            };

            elements.emotionTalkBtn.addEventListener('pointerdown', startHold);
            elements.emotionTalkBtn.addEventListener('pointerup', stopHold);
            elements.emotionTalkBtn.addEventListener('pointercancel', stopHold);
            elements.emotionTalkBtn.addEventListener('contextmenu', (event) => event.preventDefault());
            elements.emotionTalkBtn.addEventListener('keydown', async (event) => {
                if ((event.key === ' ' || event.key === 'Enter') && !state.emotionHoldActive) {
                    await startHold(event);
                }
            });
            elements.emotionTalkBtn.addEventListener('keyup', async (event) => {
                if (event.key === ' ' || event.key === 'Enter') {
                    await stopHold(event);
                }
            });
        }

        async function finishEmotionHoldRecording(event) {
            if (!state.emotionHoldActive) return;

            state.emotionHoldActive = false;
            try {
                if (event?.pointerId != null && elements.emotionTalkBtn.hasPointerCapture?.(event.pointerId)) {
                    elements.emotionTalkBtn.releasePointerCapture(event.pointerId);
                }
            } catch (e) {}

            if (!state.isRecording || state.recordingMode !== 'emotion-hold') {
                state.emotionHoldShouldStop = false;
                setEmotionTalkButtonState();
                return;
            }

            const audioBlob = await stopRecording();
            state.emotionHoldShouldStop = false;

            if (!audioBlob || !audioBlob.size) {
                setEmotionTalkButtonState();
                setStatus('error', '录音失败，请重试');
                return;
            }

            await generateVideo({
                audioBlob,
                sourceTab: 'emotion',
                pendingUserMessage: '【语音识别中...】',
                useAsrUserText: true
            });
        }

        function startMockEmotionSequence() {
            if (!state.mockMode.enabled) return;
            if (state.emotionTrigger.hasTriggeredInCurrentCameraSession) return;

            state.emotionTrigger.hasTriggeredInCurrentCameraSession = true;
            clearEmotionMockTimers();

            elements.emotionStatus.textContent = '摄像头已开启，准备模拟识别...';

            state.emotionTrigger.displayTimer = setTimeout(() => {

                setStatus('processing', '已识别到情绪，正在思考中...');

                state.emotionTrigger.playTimer = setTimeout(() => {
                    state.emotionTrigger.playTimer = null;

                    if (!state.mockMode.enabled || !elements.emotionEnabled.checked) {
                        return;
                    }

                    if (state.responsePlayback.busy || state.isProcessing || state.mockMode.isMockPlaying) {
                        state.emotionTrigger.pending = true;
                        setStatus('processing', '已识别到情绪，等待当前视频播放完成...');
                        return;
                    }

                    setStatus('success', '已识别到情绪');
                    playManagedResponseVideo({
                        videoUrl: state.emotionTrigger.videoUrl + '?t=' + Date.now(),
                        source: 'emotion-first',
                        deleteAfterPlay: false,
                        filename: null
                    });
                }, state.emotionTrigger.playDelayMs);
            }, state.emotionTrigger.scoreDelayMs);
        }

        async function startMockEmotionCapture() {
            if (state.emotionTrigger.cameraStream) return;

            try {
                resetEmotionTriggerSession();
                state.emotionTrigger.cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: false
                });

                elements.emotionCamera.srcObject = state.emotionTrigger.cameraStream;
                await elements.emotionCamera.play();
                elements.emotionCamera.style.display = 'block';
                elements.emotionCamera.style.visibility = 'visible';
                elements.emotionCamera.style.opacity = '1';
                elements.cameraOverlay.style.display = 'none';
                elements.emotionStatus.textContent = '摄像头已开启';

                startMockEmotionSequence();
            } catch (error) {
                console.error('[EmotionMock] Failed to start:', error);
                state.emotionTrigger.cameraStream = null;
                elements.emotionEnabled.checked = false;

                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    elements.emotionStatus.textContent = '摄像头权限被拒绝';
                    alert('无法访问摄像头，请在浏览器设置中允许摄像头权限');
                } else {
                    elements.emotionStatus.textContent = '摄像头启动失败';
                }
            }
        }

        function stopMockEmotionCapture() {
            clearEmotionMockTimers();
            state.emotionTrigger.pending = false;
            state.emotionTrigger.hasTriggeredInCurrentCameraSession = false;

            if (state.emotionTrigger.cameraStream) {
                state.emotionTrigger.cameraStream.getTracks().forEach(track => track.stop());
                state.emotionTrigger.cameraStream = null;
            }

            elements.emotionCamera.srcObject = null;
            elements.cameraOverlay.style.display = 'flex';
            elements.emotionStatus.textContent = '已停止';
            resetEmotionUI();

            if (!state.isProcessing && !state.responsePlayback.busy) {
                setStatus('ready', '准备就绪');
            }
        }

        function initEmotionCapture() {
            // 检查必要的 DOM 元素
            if (!elements.emotionCamera || !elements.cameraOverlay || !elements.emotionEnabled) {
                console.error('[Emotion] Required DOM elements not found:', {
                    emotionCamera: !!elements.emotionCamera,
                    cameraOverlay: !!elements.cameraOverlay,
                    emotionEnabled: !!elements.emotionEnabled
                });
                return;
            }
            console.log('[Emotion] DOM elements verified');

            // 检查浏览器支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn('[Emotion] Browser does not support getUserMedia');
                elements.emotionEnabled.disabled = true;
                elements.emotionStatus.textContent = '浏览器不支持';
                return;
            }

            if (state.mockMode.enabled) {
                elements.emotionEnabled.addEventListener('change', function() {
                    if (this.checked) {
                        startMockEmotionCapture();
                    } else {
                        stopMockEmotionCapture();
                    }
                });
                return;
            }

            // 检查 EmotionCapture 类是否加载
            if (typeof EmotionCapture === 'undefined') {
                console.warn('[Emotion] EmotionCapture class not loaded');
                elements.emotionEnabled.disabled = true;
                elements.emotionStatus.textContent = '组件加载失败';
                return;
            }

            console.log('[Emotion] Creating EmotionCapture instance...');
            // 创建情绪捕捉实例
            emotionCapture = new EmotionCapture({
                serverUrl: '',
                sampleInterval: 30000,
                videoElement: elements.emotionCamera,
                sessionId: 'default',
                enabled: false
            });

            // 注册事件监听
            emotionCapture.on(EmotionCapture.Events.STARTED, () => {
                console.log('[Emotion] STARTED event received');
                resetEmotionTriggerSession();
                if (elements.cameraOverlay) {
                    elements.cameraOverlay.style.display = 'none';
                    console.log('[Emotion] Overlay hidden');
                } else {
                    console.error('[Emotion] cameraOverlay element not found!');
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '检测中...';
                }
                if (elements.emotionCamera) {
                    const video = elements.emotionCamera;
                    console.log('[Emotion] Video element state:', {
                        readyState: video.readyState,
                        videoWidth: video.videoWidth,
                        videoHeight: video.videoHeight,
                        srcObject: video.srcObject ? 'exists' : 'null',
                        paused: video.paused,
                        muted: video.muted,
                        display: getComputedStyle(video).display,
                        visibility: getComputedStyle(video).visibility,
                        opacity: getComputedStyle(video).opacity
                    });
                    // 强制确保视频可见
                    video.style.display = 'block';
                    video.style.visibility = 'visible';
                    video.style.opacity = '1';
                    video.play().catch(e => console.warn('[Emotion] Play error:', e));
                }
            });

            emotionCapture.on(EmotionCapture.Events.STOPPED, () => {
                console.log('[Emotion] STOPPED event received');
                resetEmotionTriggerSession();
                if (elements.cameraOverlay) {
                    elements.cameraOverlay.style.display = 'flex';
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '已停止';
                }
                resetEmotionUI();
                if (!state.isProcessing && !state.responsePlayback.busy) {
                    setStatus('ready', '准备就绪');
                }
            });

            emotionCapture.on(EmotionCapture.Events.DETECTED, updateEmotionUI);

            emotionCapture.on(EmotionCapture.Events.ERROR, (data) => {
                console.error('[Emotion] Error:', data);
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '错误: ' + (data.message || '未知');
                }
            });

            emotionCapture.on(EmotionCapture.Events.PERMISSION_DENIED, () => {
                console.log('[Emotion] Permission denied');
                if (elements.emotionEnabled) {
                    elements.emotionEnabled.checked = false;
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '摄像头权限被拒绝';
                }
                alert('无法访问摄像头，请在浏览器设置中允许摄像头权限');
            });

            emotionCapture.on(EmotionCapture.Events.DISABLED, () => {
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '功能未启用（后端）';
                }
            });

            // 开关事件
            elements.emotionEnabled.addEventListener('change', function() {
                if (this.checked) {
                    emotionCapture.start();
                } else {
                    emotionCapture.stop();
                }
            });
        }

        function updateEmotionUI(emotion) {
            if (!emotion) return;

            // 更新情绪图标和文本
            const dominantEmotion = emotion.dominant_emotion || 'neutral';
            elements.emotionIcon.textContent = EMOTION_CONFIG.icons[dominantEmotion] || '😐';
            elements.emotionText.textContent = EMOTION_CONFIG.names[dominantEmotion] || '未知';

            // 更新分数条
            const scores = emotion.emotion_scores || {};
            const items = elements.emotionScores.querySelectorAll('.emotion-score-item');

            // 映射简化显示的情绪（只显示 4 个主要情绪）
            const displayEmotions = ['happy', 'sad', 'angry', 'neutral'];

            items.forEach((item, index) => {
                const emotionKey = displayEmotions[index];
                const score = scores[emotionKey] || 0;
                const fill = item.querySelector('.emotion-score-fill');
                const value = item.querySelector('.emotion-score-value');

                if (fill) {
                    fill.style.width = score + '%';
                }
                if (value) {
                    value.textContent = score.toFixed(0) + '%';
                }
            });

            // 更新状态
            const confidence = emotion.confidence || 0;
            elements.emotionStatus.textContent = `检测中... (置信度: ${confidence.toFixed(0)}%)`;
        }

        function resetEmotionUI() {
            elements.emotionIcon.textContent = '😐';
            elements.emotionText.textContent = '等待检测';

            const items = elements.emotionScores.querySelectorAll('.emotion-score-item');
            items.forEach(item => {
                const fill = item.querySelector('.emotion-score-fill');
                const value = item.querySelector('.emotion-score-value');
                if (fill) fill.style.width = '0%';
                if (value) value.textContent = '0%';
            });
        }

        async function toggleRecording() {
            if (state.recordingMode === 'emotion-hold') return;
            if (state.isRecording) {
                await stopRecording();
            } else {
                await startRecording({ mode: 'manual' });
            }
        }

        async function startRecording({ mode = 'manual' } = {}) {
            if (state.isRecording || state.isProcessing) return false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recordingStream = stream;
                state.recordingMode = mode;
                state.mediaRecorder = new MediaRecorder(stream);
                state.recordedChunks = [];
                state.recordingStopPromise = new Promise(resolve => {
                    state.recordingStopResolve = resolve;
                });
                state.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) state.recordedChunks.push(e.data);
                };
                state.mediaRecorder.onstop = () => {
                    const preferredType = state.recordedChunks[0]?.type || state.mediaRecorder?.mimeType || 'audio/webm';
                    state.recordedBlob = new Blob(state.recordedChunks, { type: preferredType });
                    if (mode === 'manual') {
                        updateRecordedAudioPreview(state.recordedBlob);
                    }
                    stream.getTracks().forEach(track => track.stop());
                    state.recordingStream = null;
                    state.mediaRecorder = null;
                    state.recordingMode = null;
                    const resolve = state.recordingStopResolve;
                    state.recordingStopResolve = null;
                    const finishedBlob = state.recordedBlob;
                    state.recordingStopPromise = null;
                    resolve?.(finishedBlob);
                };
                state.mediaRecorder.start();
                state.isRecording = true;
                switchToListeningVideo();
                if (mode === 'manual') {
                    elements.recordBtn.classList.add('recording');
                    elements.recordHint.textContent = '点击停止录音';
                } else if (mode === 'emotion-hold') {
                    setEmotionTalkButtonState({ recording: true, text: '松开结束并识别' });
                    setStatus('processing', '正在听你说话...');
                }
                return true;
            } catch (e) {
                console.error('Failed to start recording:', e);
                state.recordingMode = null;
                state.recordingStream = null;
                state.recordingStopPromise = null;
                state.recordingStopResolve = null;
                alert('无法访问麦克风，请检查权限设置');
                return false;
            }
        }

        function stopRecording() {
            if (!state.mediaRecorder || !state.isRecording) {
                return Promise.resolve(state.recordedBlob);
            }

            const mode = state.recordingMode;
            state.isRecording = false;
            switchBackFromListening();

            if (mode === 'manual') {
                elements.recordBtn.classList.remove('recording');
                elements.recordHint.textContent = '点击重新录音';
            } else if (mode === 'emotion-hold') {
                setEmotionTalkButtonState({ text: '识别中，请稍候...' });
            }

            state.mediaRecorder.stop();
            return state.recordingStopPromise || Promise.resolve(state.recordedBlob);
        }

        function addMessage(role, text) {
            state.chatHistory.push({
                role,
                text,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            });
            renderChatHistory();
            return state.chatHistory.length - 1;
        }

        function updateMessageText(index, text) {
            if (index < 0 || index >= state.chatHistory.length) return;
            state.chatHistory[index].text = text;
            renderChatHistory();
        }

        function setTyping(typing) {
            state.isTyping = typing;
            renderChatHistory();
        }

        function getAssistantAvatarHtml() {
            const avatar = state.avatars[state.currentAvatar];
            if (avatar && avatar.source_image) {
                return `<img src="${avatar.source_image}" alt="数字人">`;
            }
            return 'AI';
        }

        function renderMessageRow(item) {
            const row = document.createElement('div');
            row.className = `message-row ${item.role}`;
            const isUser = item.role === 'user';
            const avatarHtml = isUser ? '我' : getAssistantAvatarHtml();
            const name = isUser ? '我' : (state.avatars[state.currentAvatar]?.name || '数字人');
            row.innerHTML = `
                <div class="message-avatar">${avatarHtml}</div>
                <div class="message-main">
                    <div class="message-label">
                        <span>${name}</span>
                        <span>${item.time}</span>
                    </div>
                    <div class="message-bubble">
                        <div class="message-text">${escapeHtml(item.text)}</div>
                    </div>
                </div>
            `;
            return row;
        }

        function renderTypingRow() {
            const row = document.createElement('div');
            row.className = 'message-row assistant';
            const name = state.avatars[state.currentAvatar]?.name || '数字人';
            row.innerHTML = `
                <div class="message-avatar">${getAssistantAvatarHtml()}</div>
                <div class="message-main">
                    <div class="message-label">
                        <span>${name}</span>
                        <span>正在输入</span>
                    </div>
                    <div class="message-bubble">
                        <div class="typing-bubble">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            `;
            return row;
        }

        function renderChatHistory() {
            const visibleCount = state.chatHistory.length + (state.isTyping ? 1 : 0);
            const hasMessages = visibleCount > 0;
            elements.emptyChat.style.display = hasMessages ? 'none' : 'block';
            elements.chatCount.textContent = `${state.chatHistory.length} 条消息`;

            const existing = elements.chatHistory.querySelectorAll('.message-row');
            existing.forEach(node => node.remove());

            state.chatHistory.forEach(item => {
                elements.chatHistory.appendChild(renderMessageRow(item));
            });

            if (state.isTyping) {
                elements.chatHistory.appendChild(renderTypingRow());
            }

            elements.chatHistory.scrollTop = elements.chatHistory.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        async function generateVideo(options = {}) {
            if (state.isProcessing) return;

            // Mock 模式拦截
            if (state.mockMode.enabled) {
                return generateMockVideo(options);
            }

            const activeTab = options.sourceTab || getActiveTabName();
            let text = typeof options.text === 'string' ? options.text.trim() : '';
            let audioBlob = options.audioBlob || null;
            let pendingUserMessage = options.pendingUserMessage || '【语音识别中...】';
            let userMessageIndex = -1;

            if (!text && !audioBlob) {
                if (activeTab === 'text') {
                    text = elements.userText.value.trim();
                    if (!text) {
                        alert('请输入内容');
                        return;
                    }
                } else {
                    if (!state.recordedBlob) {
                        alert('请先录制语音');
                        return;
                    }
                    audioBlob = state.recordedBlob;
                }
            }

            if (text) {
                state.lastSubmittedText = text;
                if (activeTab === 'text') {
                    elements.userText.value = '';
                    elements.userText.style.height = '96px';
                }
                addMessage('user', text);
            } else {
                userMessageIndex = addMessage('user', pendingUserMessage);
            }

            state.isProcessing = true;
            refreshGenerateButtonState();
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.paused) activeIdle.play().catch(() => {});
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;
            if (inactiveIdle.readyState < 2) inactiveIdle.load();

            setStatus('processing', '正在生成... (预计 15-25 秒)');
            setTyping(true);

            try {
                const formData = new FormData();
                if (text) {
                    formData.append('text', text);
                } else if (audioBlob) {
                    formData.append('audio', audioBlob, 'recording.wav');
                }
                formData.append('source_image', state.currentAvatar);

                const response = await fetch('/api/v1/generate', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.msg || '生成失败');

                const data = result.data;
                elements.progress.style.width = '100%';
                setStatus('success', `生成完成，耗时 ${data.total_time.toFixed(1)} 秒`);

                if (!text && userMessageIndex >= 0) {
                    const recognizedUserText = (data.user_text || '').trim() || '【语音输入】';
                    updateMessageText(userMessageIndex, recognizedUserText);
                }

                setTyping(false);
                addMessage('assistant', data.response_text || '已生成回复');

                const dataMetrics = data.metrics || {};
                metrics.total.textContent = data.total_time.toFixed(1) + 's';
                metrics.llm.textContent = (dataMetrics.llm_time || 0).toFixed(1) + 's';
                metrics.tts.textContent = (dataMetrics.tts_time || 0).toFixed(1) + 's';
                metrics.video.textContent = (dataMetrics.video_time || 0).toFixed(1) + 's';

                // 提取视频文件名（格式: /videos/xxx.mp4）
                const videoFilename = data.video_url.split('/').pop().split('?')[0];
                playManagedResponseVideo({
                    videoUrl: data.video_url + '?t=' + Date.now(),
                    source: 'generated',
                    deleteAfterPlay: true,
                    filename: videoFilename
                });
            } catch (error) {
                console.error('Generation error:', error);
                setTyping(false);
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入失败】');
                }
                addMessage('assistant', `生成失败：${error.message}`);
                setStatus('error', '生成失败: ' + error.message);
            } finally {
                setTyping(false);
                state.isProcessing = false;
                refreshGenerateButtonState();
                if (activeTab === 'emotion') {
                    setEmotionTalkButtonState();
                }
            }
        }

        async function generateMockVideo(options = {}) {
            if (state.isProcessing || state.mockMode.isMockPlaying || state.responsePlayback.busy) return;

            const activeTab = options.sourceTab || getActiveTabName();
            let text = typeof options.text === 'string' ? options.text.trim() : '';
            let audioBlob = options.audioBlob || null;
            let userMessageIndex = -1;

            if (!text && !audioBlob) {
                if (activeTab === 'text') {
                    text = elements.userText.value.trim();
                    if (!text) { alert('请输入内容'); return; }
                } else {
                    if (!state.recordedBlob) { alert('请先录制语音'); return; }
                    audioBlob = state.recordedBlob;
                }
            }

            if (text) {
                state.lastSubmittedText = text;
                if (activeTab === 'text') {
                    elements.userText.value = '';
                    elements.userText.style.height = '96px';
                }
                addMessage('user', text);
            } else {
                userMessageIndex = addMessage('user', options.pendingUserMessage || '【语音识别中...】');
            }

            state.isProcessing = true;
            state.mockMode.isMockPlaying = true;
            refreshGenerateButtonState();

            setStatus('processing', '正在思考...');
            setTyping(true);

            try {
                const stepCount = Math.min(state.mockMode.responses.length, state.mockMode.videos.length);
                if (stepCount <= 0) {
                    throw new Error('Mock 配置不完整');
                }

                const stepIndex = state.mockMode.currentIndex % stepCount;
                const mockResponse = state.mockMode.responses[stepIndex];
                const mockVideoUrl = state.mockMode.videos[stepIndex];

                // 2-3秒随机延迟
                const delay = 2000 + Math.random() * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));

                setStatus('success', '生成完成');
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入】');
                }
                setTyping(false);
                addMessage('assistant', mockResponse);

                // 模拟指标
                metrics.total.textContent = (delay/1000 + 0.5).toFixed(1) + 's';
                metrics.llm.textContent = (delay/1000 * 0.4).toFixed(1) + 's';
                metrics.tts.textContent = (delay/1000 * 0.2).toFixed(1) + 's';
                metrics.video.textContent = (delay/1000 * 0.4).toFixed(1) + 's';

                playManagedResponseVideo({
                    videoUrl: mockVideoUrl + '?t=' + Date.now(),
                    source: 'mock',
                    deleteAfterPlay: false,
                    filename: null
                });

                // 步进到下一个（循环）
                state.mockMode.currentIndex = (state.mockMode.currentIndex + 1) % stepCount;

            } catch (error) {
                setTyping(false);
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入失败】');
                }
                addMessage('assistant', `Mock 错误：${error.message}`);
                setStatus('error', 'Mock 错误: ' + error.message);
            } finally {
                setTyping(false);
                state.isProcessing = false;
                state.mockMode.isMockPlaying = false;
                if (!state.responsePlayback.busy) {
                    tryPlayPendingEmotionVideo();
                }
                refreshGenerateButtonState();
                if (activeTab === 'emotion') {
                    setEmotionTalkButtonState();
                }
            }
        }

        function playResponseVideo(videoUrl) {
            // 在切换前确保 idle 帧缓冲已保存
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                saveFrameBuffer('idle', activeIdle);
            }

            elements.responseVideo.src = videoUrl;
            elements.responseVideo.load();

            let hasStartedSwitch = false;

            const tryStartSwitch = () => {
                if (hasStartedSwitch) return;
                if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                    hasStartedSwitch = true;
                    // 先保存 response 第一帧到缓冲
                    saveFrameBuffer('response', elements.responseVideo);
                    // 暂停 idle 视频（节省资源，保持帧缓冲稳定）
                    elements.idleVideo.pause();
                    elements.idleVideo2.pause();
                    // 开始切换
                    state.showingResponse = true;
                    switchToResponseVideo();
                    // 播放视频
                    elements.responseVideo.play().catch(() => {});
                }
            };

            // 监听多个事件确保尽早开始
            elements.responseVideo.onloadeddata = () => {
                setTimeout(tryStartSwitch, 20);
            };
            elements.responseVideo.oncanplay = tryStartSwitch;
            elements.responseVideo.oncanplaythrough = tryStartSwitch;

            // 备用检查
            const checkReady = () => {
                if (!hasStartedSwitch) {
                    tryStartSwitch();
                    if (!hasStartedSwitch) {
                        setTimeout(checkReady, 50);
                    }
                }
            };
            setTimeout(checkReady, 100);
        }

        function setStatus(type, text) {
            elements.statusBar.className = 'status-bar ' + type;
            elements.statusBar.querySelector('.status-text').textContent = text;
            if (type === 'processing') {
                elements.progressBar.classList.add('active');
                startProgressAnimation();
            } else {
                elements.progressBar.classList.remove('active');
                stopProgressAnimation();
            }
        }

        function startProgressAnimation() {
            let currentProgress = 0;
            const steps = [15, 30, 50, 80, 95];
            let stepIndex = 0;
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (stepIndex >= steps.length) return;
                if (currentProgress < steps[stepIndex]) {
                    currentProgress += 1;
                    elements.progress.style.width = currentProgress + '%';
                } else {
                    stepIndex += 1;
                }
            }, 200);
        }

        function stopProgressAnimation() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            elements.progress.style.width = '0%';
        }

        function openPortalPage(target) {
            if (target === 'brief') {
                window.location.href = 'brief.html';
                return;
            }
            if (!target || target === 'home') {
                window.location.href = 'xinyu_complete .html';
                return;
            }
            window.location.href = 'xinyu_complete .html#' + target;
        }

        function clearAll() {
            clearResponseCleanupTimers();
            resetResponsePlaybackState();
            resetEmotionTriggerSession();
            if (state.mediaRecorder && state.isRecording) {
                try {
                    state.mediaRecorder.onstop = () => {};
                    state.mediaRecorder.stop();
                } catch (e) {}
            }
            if (state.recordingStream) {
                state.recordingStream.getTracks().forEach(track => track.stop());
            }
            state.isRecording = false;
            state.recordingStream = null;
            state.recordingMode = null;
            state.recordingStopPromise = null;
            state.recordingStopResolve = null;
            state.emotionHoldActive = false;
            state.emotionHoldShouldStop = false;
            state.emotionHoldStartPromise = null;
            if (state.mockMode.enabled && state.emotionTrigger.cameraStream) {
                stopMockEmotionCapture();
                elements.emotionEnabled.checked = false;
            }
            elements.userText.value = '';
            state.recordedBlob = null;
            state.recordedChunks = [];
            state.chatHistory = [];
            state.isTyping = false;
            state.lastSubmittedText = '';
            clearRecordedAudioPreview();
            elements.recordBtn.classList.remove('recording');
            elements.recordHint.textContent = '点击开始录音';
            setEmotionTalkButtonState();
            elements.responseVideo.src = '';
            elements.responseVideo.load();
            state.showingResponse = false;
            state.crossfadeAlpha = 1.0;
            state.crossfadeTarget = 1.0;
            state.lastResponseFrame = null;
            metrics.total.textContent = '--';
            metrics.llm.textContent = '--';
            metrics.tts.textContent = '--';
            metrics.video.textContent = '--';

            // 重置 Mock 状态
            if (state.mockMode.enabled) {
                state.mockMode.currentIndex = 0;
                state.mockMode.isMockPlaying = false;
            }

            renderChatHistory();
            playIdleVideo(state.currentAvatar);
            refreshGenerateButtonState();
            setStatus('ready', '准备就绪');
        }

        elements.userText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateVideo();
            }
        });

        init();
    </script>
</body>
