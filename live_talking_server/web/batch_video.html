<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人对话系统 - 批量视频生成</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --panel-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: rgba(255, 255, 255, 0.65);
            --text-light: rgba(255, 255, 255, 0.9);
            --primary: #00d2ff;
            --primary-2: #3a7bd5;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 12px;
            overflow: hidden;
        }

        .container {
            max-width: 1580px;
            height: calc(100vh - 24px);
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px 24px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 24px;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(620px, 1.55fr) minmax(340px, 0.9fr);
            gap: 18px;
            align-items: stretch;
            height: calc(100% - 40px);
            min-height: 0;
        }

        .left-panel,
        .right-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            min-height: 0;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .avatar-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }

        .avatar-item {
            width: 96px;
            cursor: pointer;
            border-radius: 14px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            transition: all 0.25s ease;
            text-align: center;
        }

        .avatar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .avatar-item.active {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.12);
            box-shadow: 0 0 0 1px rgba(0, 210, 255, 0.15) inset;
        }

        .avatar-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 8px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .avatar-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
        }

        .video-shell {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 220px);
            min-height: 0;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
        }

        #render-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        #idle-video,
        #idle-video-2,
        #response-video {
            display: none;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #777;
            font-size: 18px;
            background: #111;
        }

        .video-overlay .icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .status-bar {
            margin-bottom: 0;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .status-bar.ready { background: rgba(52, 152, 219, 0.16); color: #7cc3ff; }
        .status-bar.processing { background: rgba(241, 196, 15, 0.18); color: var(--warning); }
        .status-bar.success { background: rgba(46, 204, 113, 0.18); color: var(--success); }
        .status-bar.error { background: rgba(231, 76, 60, 0.18); color: #ff9a8f; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active { display: block; }

        .progress {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            transition: width 0.3s ease;
        }

        .input-tabs {
            display: flex;
            margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 5px;
        }

        .input-tab {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-size: 14px;
        }

        .input-tab.active {
            background: rgba(0, 210, 255, 0.18);
            color: var(--primary);
        }

        .input-tab-content { display: none; }
        .input-tab-content.active { display: block; }

        textarea {
            width: 100%;
            min-height: 88px;
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.25s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-2);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .audio-record-section {
            text-align: center;
            padding: 16px 12px 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 14px;
        }

        .record-btn.recording {
            border-color: var(--danger);
            background: rgba(231, 76, 60, 0.2);
            animation: pulse 1s infinite;
        }

        .record-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--danger);
        }

        .record-btn.recording .record-icon {
            width: 24px;
            height: 24px;
            border-radius: 5px;
        }

        .record-hint {
            color: rgba(255, 255, 255, 0.58);
            font-size: 14px;
        }

        .audio-preview {
            margin-top: 16px;
            display: none;
        }

        .audio-preview audio {
            width: 100%;
            max-width: 320px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }

        button {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(58, 123, 213, 0.28);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        .chat-section {
            margin-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 12px;
        }

        .chat-title-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-title {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .chat-subtitle {
            color: rgba(255, 255, 255, 0.42);
            font-size: 12px;
            line-height: 1.5;
        }

        .chat-count {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            white-space: nowrap;
            padding-top: 2px;
        }

        .chat-history {
            min-height: 140px;
            max-height: none;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .empty-chat {
            color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px;
            line-height: 1.6;
        }

        .message-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: rgba(255,255,255,0.12);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 6px 14px rgba(0,0,0,0.18);
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-main {
            max-width: min(88%, 680px);
        }

        .message-row.user .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .message-row.assistant .message-main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.48);
            margin-bottom: 6px;
            padding: 0 2px;
        }

        .message-bubble {
            width: fit-content;
            max-width: 100%;
            padding: 14px 16px;
            border-radius: 18px;
            line-height: 1.72;
            font-size: 15px;
            color: var(--text-light);
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .message-row.user .message-bubble {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.22), rgba(58, 123, 213, 0.24));
            border-top-right-radius: 6px;
        }

        .message-row.assistant .message-bubble {
            background: rgba(255, 255, 255, 0.08);
            border-top-left-radius: 6px;
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 72px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.72);
            animation: blink 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        .message-text {
            display: block;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .metric {
            padding: 10px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-align: center;
        }

        .metric .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .metric .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; }
            40% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 1200px) {
            body { overflow: auto; }
            .container {
                height: auto;
                min-height: calc(100vh - 24px);
                overflow: visible;
            }
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .video-container {
                max-height: 72vh;
                min-height: 52vh;
            }
        }

        @media (max-width: 640px) {
            body { padding: 12px; overflow: auto; }
            .container { padding: 16px; height: auto; }
            h1 { font-size: 22px; }
            .button-group { flex-direction: column; }
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .avatar-item { width: 88px; }
            .message-bubble { max-width: 100%; }
            .video-container { max-height: 62vh; min-height: 46vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数字人对话系统</h1>

        <div class="main-layout">
            <section class="left-panel">
                <div class="video-shell">
                    <div class="video-container" id="video-container">
                        <div class="video-overlay" id="video-overlay">
                            <div class="icon">🎬</div>
                            <div>加载中...</div>
                        </div>
                        <canvas id="render-canvas"></canvas>
                        <video id="idle-video" muted playsinline preload="auto"></video>
                        <video id="idle-video-2" muted playsinline preload="auto"></video>
                        <video id="response-video" playsinline></video>
                    </div>
                </div>

                <div>
                    <div class="section-title">选择数字人</div>
                    <div class="avatar-list" id="avatar-list"></div>
                </div>
            </section>

            <section class="right-panel">
                <div class="status-bar ready" id="status-bar">
                    <div class="status-text">准备就绪</div>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                </div>

                <div class="section-title">交互输入</div>
                <div class="input-tabs">
                    <div class="input-tab active" data-tab="text">文字输入</div>
                    <div class="input-tab" data-tab="voice">语音输入</div>
                </div>

                <div class="input-tab-content active" id="text-input">
                    <textarea id="user-text" placeholder="请输入您想问的问题..."></textarea>
                </div>

                <div class="input-tab-content" id="voice-input">
                    <div class="audio-record-section">
                        <div class="record-btn" id="record-btn">
                            <div class="record-icon"></div>
                        </div>
                        <div class="record-hint" id="record-hint">点击开始录音</div>
                        <div class="audio-preview" id="audio-preview">
                            <audio id="recorded-audio" controls></audio>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="generate-btn" onclick="generateVideo()">发送并生成</button>
                    <button class="btn-secondary" onclick="clearAll()">清空</button>
                </div>

                <div class="chat-section">
                    <div class="chat-header">
                        <div class="chat-title-wrap">
                            <div class="chat-title">当前会话</div>
                            <div class="chat-subtitle">右侧按聊天流展示整轮对话，发送后会自动滚动到最新消息。</div>
                        </div>
                        <div class="chat-count" id="chat-count">0 条消息</div>
                    </div>
                    <div class="chat-history" id="chat-history">
                        <div class="empty-chat" id="empty-chat">这里会按对话顺序显示你的输入和数字人的回复，效果更接近聊天窗口。</div>
                    </div>

                    <div class="metrics" id="metrics">
                        <div class="metric">
                            <div class="value" id="metric-total">--</div>
                            <div class="label">总耗时</div>
                        </div>
                        <div class="metric">
                            <div class="value" id="metric-llm">--</div>
                            <div class="label">LLM</div>
                        </div>
                        <div class="metric">
                            <div class="value" id="metric-tts">--</div>
                            <div class="label">TTS</div>
                        </div>
                        <div class="metric">
                            <div class="value" id="metric-video">--</div>
                            <div class="label">视频</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const state = {
            currentAvatar: 'human_1',
            avatars: {},
            isProcessing: false,
            isRecording: false,
            mediaRecorder: null,
            recordedChunks: [],
            recordedBlob: null,
            showingResponse: false,
            crossfadeAlpha: 1.0,
            crossfadeTarget: 1.0,
            animationFrameId: null,
            activeIdleVideo: 1,
            idleVideoUrl: '',
            idleCrossfadeAlpha: 1.0,
            isIdleCrossfading: false,
            lastIdleFrame: null,
            lastResponseFrame: null,
            chatHistory: [],
            lastSubmittedText: '',
            currentVideoFilename: null  // 当前播放的视频文件名，用于播放完成后删除
        };

        const elements = {
            avatarList: document.getElementById('avatar-list'),
            renderCanvas: document.getElementById('render-canvas'),
            idleVideo: document.getElementById('idle-video'),
            idleVideo2: document.getElementById('idle-video-2'),
            responseVideo: document.getElementById('response-video'),
            videoOverlay: document.getElementById('video-overlay'),
            videoContainer: document.getElementById('video-container'),
            statusBar: document.getElementById('status-bar'),
            progressBar: document.getElementById('progress-bar'),
            progress: document.getElementById('progress'),
            generateBtn: document.getElementById('generate-btn'),
            userText: document.getElementById('user-text'),
            recordBtn: document.getElementById('record-btn'),
            recordHint: document.getElementById('record-hint'),
            audioPreview: document.getElementById('audio-preview'),
            recordedAudio: document.getElementById('recorded-audio'),
            chatHistory: document.getElementById('chat-history'),
            chatCount: document.getElementById('chat-count'),
            emptyChat: document.getElementById('empty-chat')
        };

        let ctx = null;
        let canvasWidth = 450;
        let canvasHeight = 800;
        let progressInterval = null;

        const metrics = {
            total: document.getElementById('metric-total'),
            llm: document.getElementById('metric-llm'),
            tts: document.getElementById('metric-tts'),
            video: document.getElementById('metric-video')
        };

        function initCanvasRenderer() {
            ctx = elements.renderCanvas.getContext('2d');
            resizeCanvasToContainer();
            state.offscreenCanvas = document.createElement('canvas');
            state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            syncOffscreenCanvas();
            startRenderLoop();
            window.addEventListener('resize', resizeCanvasToContainer);
        }

        function resizeCanvasToContainer() {
            const rect = elements.videoContainer.getBoundingClientRect();
            const nextWidth = Math.max(1, Math.floor(rect.width || 450));
            const nextHeight = Math.max(1, Math.floor(rect.height || 800));

            if (nextWidth === canvasWidth && nextHeight === canvasHeight) return;

            canvasWidth = nextWidth;
            canvasHeight = nextHeight;
            elements.renderCanvas.width = canvasWidth;
            elements.renderCanvas.height = canvasHeight;
            syncOffscreenCanvas();
        }

        function syncOffscreenCanvas() {
            if (!state.offscreenCanvas) return;
            state.offscreenCanvas.width = canvasWidth;
            state.offscreenCanvas.height = canvasHeight;
        }

        function updateVideoAspectRatio(video) {
            if (video.videoWidth && video.videoHeight) {
                elements.videoContainer.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
                requestAnimationFrame(resizeCanvasToContainer);
            }
        }

        function drawVideoContain(video, alpha) {
            if (!video || video.readyState < 2 || alpha <= 0) return false;
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const scale = Math.min(canvasWidth / vW, canvasHeight / vH);
            const drawWidth = vW * scale;
            const drawHeight = vH * scale;
            const dx = (canvasWidth - drawWidth) / 2;
            const dy = (canvasHeight - drawHeight) / 2;

            try {
                ctx.globalAlpha = alpha;
                ctx.drawImage(video, dx, dy, drawWidth, drawHeight);
                return true;
            } catch (e) {
                return false;
            }
        }

        function startRenderLoop() {
            const render = () => {
                renderFrame();
                state.animationFrameId = requestAnimationFrame(render);
            };
            render();
        }

        function renderFrame() {
            if (!ctx) return;

            // 淡入淡出速度
            const fadeSpeed = 0.08;
            if (state.crossfadeAlpha < state.crossfadeTarget) {
                state.crossfadeAlpha = Math.min(state.crossfadeAlpha + fadeSpeed, state.crossfadeTarget);
            } else if (state.crossfadeAlpha > state.crossfadeTarget) {
                state.crossfadeAlpha = Math.max(state.crossfadeAlpha - fadeSpeed, state.crossfadeTarget);
            }

            const idleFadeSpeed = 0.1;
            if (state.idleCrossfadeAlpha < 1.0 && state.isIdleCrossfading) {
                state.idleCrossfadeAlpha = Math.min(state.idleCrossfadeAlpha + idleFadeSpeed, 1.0);
                if (state.idleCrossfadeAlpha >= 1.0) state.isIdleCrossfading = false;
            }

            // 确保离屏 canvas 存在且尺寸正确
            if (!state.offscreenCanvas) {
                state.offscreenCanvas = document.createElement('canvas');
                state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            }
            if (state.offscreenCanvas.width !== canvasWidth || state.offscreenCanvas.height !== canvasHeight) {
                state.offscreenCanvas.width = canvasWidth;
                state.offscreenCanvas.height = canvasHeight;
            }

            const offCtx = state.offscreenCtx;

            // ========== 清空并填充黑色背景 ==========
            offCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;

            // ========== 绘制 IDLE 层 ==========
            const idleAlpha = state.crossfadeAlpha;
            if (idleAlpha > 0.001) {
                if (state.isIdleCrossfading) {
                    // Crossfade 模式：旧视频淡出，新视频淡入
                    // 帧缓冲作为新视频还没准备好时的兜底

                    // 1. 绘制旧视频/帧缓冲淡出
                    const outAlpha = idleAlpha * (1 - state.idleCrossfadeAlpha);
                    if (outAlpha > 0.01) {
                        // 优先绘制旧视频
                        if (inactiveIdle.readyState >= 2 && inactiveIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, inactiveIdle, outAlpha);
                        } else if (state.idleFrameBuffer) {
                            // ���视频不可用时用帧缓冲
                            offCtx.globalAlpha = outAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }

                    // 2. 绘制新视频淡入
                    const inAlpha = idleAlpha * state.idleCrossfadeAlpha;
                    if (inAlpha > 0.01) {
                        if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, activeIdle, inAlpha);
                            // 更新帧缓冲为新视频
                            saveFrameBuffer('idle', activeIdle);
                        } else if (state.idleFrameBuffer) {
                            // 新视频不可用时用帧缓冲
                            offCtx.globalAlpha = inAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }
                } else {
                    // 正常模式：帧缓冲打底 + 视频覆盖
                    if (state.idleFrameBuffer) {
                        offCtx.globalAlpha = idleAlpha;
                        offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                        offCtx.globalAlpha = 1;
                    }
                    if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                        drawVideoToContext(offCtx, activeIdle, idleAlpha);
                        saveFrameBuffer('idle', activeIdle);
                    }
                }
            }

            // ========== 绘制 RESPONSE 层 ==========
            const responseAlpha = 1 - state.crossfadeAlpha;
            if (responseAlpha > 0.001) {
                // 帧缓冲打底
                if (state.responseFrameBuffer) {
                    offCtx.globalAlpha = responseAlpha;
                    offCtx.drawImage(state.responseFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                    offCtx.globalAlpha = 1;
                }
                // 视频覆盖
                if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                    drawVideoToContext(offCtx, elements.responseVideo, responseAlpha);
                    saveFrameBuffer('response', elements.responseVideo);
                }
            }

            // ========== 绘制到主 canvas ==========
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(state.offscreenCanvas, 0, 0);
        }

        // 绘制视频到指定 context
        function drawVideoToContext(targetCtx, video, alpha) {
            if (!video || video.readyState < 2 || alpha <= 0.01) return false;
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const scale = Math.min(canvasWidth / vW, canvasHeight / vH);
            const drawWidth = vW * scale;
            const drawHeight = vH * scale;
            const dx = (canvasWidth - drawWidth) / 2;
            const dy = (canvasHeight - drawHeight) / 2;

            try {
                targetCtx.globalAlpha = alpha;
                targetCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
                return true;
            } catch (e) {
                return false;
            }
        }

        // 保存帧缓冲
        function saveFrameBuffer(type, video) {
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH || canvasWidth <= 0 || canvasHeight <= 0) return;

            const bufferKey = type + 'FrameBuffer';
            if (!state[bufferKey]) {
                state[bufferKey] = document.createElement('canvas');
            }
            // 确保帧缓冲尺寸与主 canvas 匹配
            if (state[bufferKey].width !== canvasWidth || state[bufferKey].height !== canvasHeight) {
                state[bufferKey].width = canvasWidth;
                state[bufferKey].height = canvasHeight;
            }

            const bufferCtx = state[bufferKey].getContext('2d');
            bufferCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            bufferCtx.fillStyle = '#000';
            bufferCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const scale = Math.min(canvasWidth / vW, canvasHeight / vH);
            const drawWidth = vW * scale;
            const drawHeight = vH * scale;
            const dx = (canvasWidth - drawWidth) / 2;
            const dy = (canvasHeight - drawHeight) / 2;

            try {
                bufferCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
            } catch (e) {}
        }

        function switchToResponseVideo() {
            state.crossfadeTarget = 0.0;
        }

        function switchToIdleVideo() {
            state.crossfadeTarget = 1.0;
        }

        const IDLE_CROSSFADE_TIME = 0.3;

        function initIdleVideoEvents(video, videoNum) {
            video.addEventListener('loadedmetadata', () => updateVideoAspectRatio(video));

            video.addEventListener('timeupdate', () => {
                if (state.showingResponse) return;
                const remainingTime = video.duration - video.currentTime;
                const isActive = state.activeIdleVideo === videoNum;
                if (isActive && remainingTime < IDLE_CROSSFADE_TIME && !state.isIdleCrossfading) {
                    const otherVideo = videoNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    const otherNum = videoNum === 1 ? 2 : 1;
                    if (otherVideo.readyState >= 2) {
                        // 在切换前保存当前帧到缓冲
                        if (video.readyState >= 2 && video.videoWidth > 0) {
                            saveFrameBuffer('idle', video);
                        }
                        state.isIdleCrossfading = true;
                        state.activeIdleVideo = otherNum;
                        // 从 1.0 开始，让新视频逐渐淡入覆盖旧帧
                        state.idleCrossfadeAlpha = 0.0;
                        otherVideo.currentTime = 0;
                        otherVideo.play().catch(() => {});
                    }
                }
            });

            video.addEventListener('ended', () => {
                if (state.showingResponse) return;
                const localNum = video === elements.idleVideo ? 1 : 2;
                if (state.activeIdleVideo !== localNum) {
                    video.currentTime = 0;
                    video.pause();
                } else {
                    const otherVideo = localNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    // 在切换前保存当前帧到缓冲
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        saveFrameBuffer('idle', video);
                    }
                    state.activeIdleVideo = localNum === 1 ? 2 : 1;
                    state.idleCrossfadeAlpha = 0.0;
                    state.isIdleCrossfading = true;
                    otherVideo.currentTime = 0;
                    otherVideo.play().catch(() => {});
                }
            });

            video.addEventListener('pause', () => {
                if (!state.showingResponse && state.activeIdleVideo === videoNum) {
                    video.play().catch(() => {});
                }
            });
        }

        async function init() {
            initCanvasRenderer();
            await loadAvatars();
            initTabs();
            initAudioRecorder();
            initVideoEvents();
            initTextareaAutoResize();
            renderChatHistory();
        }

        function initVideoEvents() {
            initIdleVideoEvents(elements.idleVideo, 1);
            initIdleVideoEvents(elements.idleVideo2, 2);

            elements.responseVideo.addEventListener('loadedmetadata', () => updateVideoAspectRatio(elements.responseVideo));
            elements.responseVideo.addEventListener('ended', onResponseVideoEnded);

            elements.idleVideo.addEventListener('loadeddata', () => {
                if (!state.showingResponse) {
                    elements.idleVideo.play().catch(() => {});
                }
            });
        }

        function onResponseVideoEnded() {
            // 立即保存 response 最后一帧
            if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                saveFrameBuffer('response', elements.responseVideo);
            }

            // idle 帧缓冲在 playResponseVideo 时已保存，这里不需要更新
            // 只需要恢复 idle 视频播放

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.paused) {
                activeIdle.play().catch(() => {});
            }

            state.showingResponse = false;
            switchToIdleVideo();

            // 删除已播放完成的视频文件
            if (state.currentVideoFilename) {
                deletePlayedVideo(state.currentVideoFilename);
                state.currentVideoFilename = null;
            }

            // 延迟清理 response 资源，让帧缓冲有时间淡出
            setTimeout(() => {
                elements.responseVideo.src = '';
                elements.responseVideo.load();
                setTimeout(() => {
                    state.responseFrameBuffer = null;
                }, 1000);
            }, 500);
        }

        async function deletePlayedVideo(filename) {
            try {
                const response = await fetch(`/api/v1/video/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.code === 0) {
                    console.log(`[VideoCleanup] Deleted: ${filename}`);
                } else {
                    console.warn(`[VideoCleanup] Failed to delete: ${filename}`, result.msg);
                }
            } catch (e) {
                console.error(`[VideoCleanup] Error deleting ${filename}:`, e);
            }
        }

        async function loadAvatars() {
            try {
                const response = await fetch('/list_avatars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const result = await response.json();
                if (result.code === 0 && result.data.avatars) {
                    state.avatars = {};
                    elements.avatarList.innerHTML = '';
                    result.data.avatars.forEach(avatar => {
                        state.avatars[avatar.id] = avatar;
                        const item = document.createElement('div');
                        item.className = 'avatar-item' + (avatar.id === result.data.default ? ' active' : '');
                        item.dataset.avatarId = avatar.id;
                        item.innerHTML = `
                            <img class="avatar-preview" src="${avatar.source_image}" alt="${avatar.name}">
                            <div class="avatar-name">${avatar.name}</div>
                        `;
                        item.onclick = () => selectAvatar(avatar.id);
                        elements.avatarList.appendChild(item);
                    });
                    state.currentAvatar = result.data.default;
                    playIdleVideo(state.currentAvatar);
                }
            } catch (e) {
                console.error('Failed to load avatars:', e);
            }
        }

        function selectAvatar(avatarId) {
            if (state.isProcessing) return;
            state.currentAvatar = avatarId;
            document.querySelectorAll('.avatar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.avatarId === avatarId);
            });
            playIdleVideo(avatarId);
        }

        function playIdleVideo(avatarId) {
            const avatar = state.avatars[avatarId];
            if (avatar && avatar.idle_video) {
                elements.videoOverlay.style.display = 'none';
                state.idleVideoUrl = avatar.idle_video;
                state.activeIdleVideo = 1;
                state.idleCrossfadeAlpha = 1.0;
                state.isIdleCrossfading = false;
                elements.idleVideo.src = avatar.idle_video;
                elements.idleVideo.load();
                setTimeout(() => {
                    elements.idleVideo2.src = avatar.idle_video;
                    elements.idleVideo2.load();
                }, 100);
                elements.idleVideo.play().catch(() => {});
            } else {
                elements.videoOverlay.innerHTML = '<div class="icon">👤</div><div>无待机动画</div>';
                elements.videoOverlay.style.display = 'flex';
                elements.idleVideo.src = '';
                elements.idleVideo2.src = '';
            }
        }

        function initTabs() {
            document.querySelectorAll('.input-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.input-tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab + '-input').classList.add('active');
                };
            });
        }

        function initAudioRecorder() {
            elements.recordBtn.onclick = toggleRecording;
        }

        function initTextareaAutoResize() {
            const resize = () => {
                elements.userText.style.height = 'auto';
                elements.userText.style.height = Math.min(elements.userText.scrollHeight, 240) + 'px';
            };
            elements.userText.addEventListener('input', resize);
            resize();
        }

        async function toggleRecording() {
            if (state.isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.recordedChunks = [];
                state.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) state.recordedChunks.push(e.data);
                };
                state.mediaRecorder.onstop = () => {
                    state.recordedBlob = new Blob(state.recordedChunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(state.recordedBlob);
                    elements.recordedAudio.src = url;
                    elements.audioPreview.style.display = 'block';
                    stream.getTracks().forEach(track => track.stop());
                };
                state.mediaRecorder.start();
                state.isRecording = true;
                elements.recordBtn.classList.add('recording');
                elements.recordHint.textContent = '点击停止录音';
            } catch (e) {
                console.error('Failed to start recording:', e);
                alert('无法访问麦克风，请检查权限设置');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                elements.recordBtn.classList.remove('recording');
                elements.recordHint.textContent = '点击重新录音';
            }
        }

        function addMessage(role, text) {
            state.chatHistory.push({
                role,
                text,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            });
            renderChatHistory();
        }

        function setTyping(typing) {
            state.isTyping = typing;
            renderChatHistory();
        }

        function getAssistantAvatarHtml() {
            const avatar = state.avatars[state.currentAvatar];
            if (avatar && avatar.source_image) {
                return `<img src="${avatar.source_image}" alt="数字人">`;
            }
            return 'AI';
        }

        function renderMessageRow(item) {
            const row = document.createElement('div');
            row.className = `message-row ${item.role}`;
            const isUser = item.role === 'user';
            const avatarHtml = isUser ? '我' : getAssistantAvatarHtml();
            const name = isUser ? '我' : (state.avatars[state.currentAvatar]?.name || '数字人');
            row.innerHTML = `
                <div class="message-avatar">${avatarHtml}</div>
                <div class="message-main">
                    <div class="message-label">
                        <span>${name}</span>
                        <span>${item.time}</span>
                    </div>
                    <div class="message-bubble">
                        <div class="message-text">${escapeHtml(item.text)}</div>
                    </div>
                </div>
            `;
            return row;
        }

        function renderTypingRow() {
            const row = document.createElement('div');
            row.className = 'message-row assistant';
            const name = state.avatars[state.currentAvatar]?.name || '数字人';
            row.innerHTML = `
                <div class="message-avatar">${getAssistantAvatarHtml()}</div>
                <div class="message-main">
                    <div class="message-label">
                        <span>${name}</span>
                        <span>正在输入</span>
                    </div>
                    <div class="message-bubble">
                        <div class="typing-bubble">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            `;
            return row;
        }

        function renderChatHistory() {
            const visibleCount = state.chatHistory.length + (state.isTyping ? 1 : 0);
            const hasMessages = visibleCount > 0;
            elements.emptyChat.style.display = hasMessages ? 'none' : 'block';
            elements.chatCount.textContent = `${state.chatHistory.length} 条消息`;

            const existing = elements.chatHistory.querySelectorAll('.message-row');
            existing.forEach(node => node.remove());

            state.chatHistory.forEach(item => {
                elements.chatHistory.appendChild(renderMessageRow(item));
            });

            if (state.isTyping) {
                elements.chatHistory.appendChild(renderTypingRow());
            }

            elements.chatHistory.scrollTop = elements.chatHistory.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        async function generateVideo() {
            if (state.isProcessing) return;

            const activeTab = document.querySelector('.input-tab.active').dataset.tab;
            let text = null;
            let audioBlob = null;

            if (activeTab === 'text') {
                text = elements.userText.value.trim();
                if (!text) {
                    alert('请输入内容');
                    return;
                }
                state.lastSubmittedText = text;
                elements.userText.value = '';
                elements.userText.style.height = '88px';
                addMessage('user', text);
            } else {
                if (!state.recordedBlob) {
                    alert('请先录制语音');
                    return;
                }
                audioBlob = state.recordedBlob;
                addMessage('user', '【语音输入】');
            }

            state.isProcessing = true;
            elements.generateBtn.disabled = true;
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.paused) activeIdle.play().catch(() => {});
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;
            if (inactiveIdle.readyState < 2) inactiveIdle.load();

            setStatus('processing', '正在生成... (预计 15-25 秒)');
            setTyping(true);

            try {
                const formData = new FormData();
                if (text) {
                    formData.append('text', text);
                } else if (audioBlob) {
                    formData.append('audio', audioBlob, 'recording.wav');
                }
                formData.append('source_image', state.currentAvatar);

                const response = await fetch('/api/v1/generate', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.msg || '生成失败');

                const data = result.data;
                elements.progress.style.width = '100%';
                setStatus('success', `生成完成，耗时 ${data.total_time.toFixed(1)} 秒`);

                setTyping(false);
                addMessage('assistant', data.response_text || '已生成回复');

                const dataMetrics = data.metrics || {};
                metrics.total.textContent = data.total_time.toFixed(1) + 's';
                metrics.llm.textContent = (dataMetrics.llm_time || 0).toFixed(1) + 's';
                metrics.tts.textContent = (dataMetrics.tts_time || 0).toFixed(1) + 's';
                metrics.video.textContent = (dataMetrics.video_time || 0).toFixed(1) + 's';

                // 提取视频文件名（格式: /videos/xxx.mp4）
                const videoFilename = data.video_url.split('/').pop().split('?')[0];
                state.currentVideoFilename = videoFilename;
                playResponseVideo(data.video_url + '?t=' + Date.now());
            } catch (error) {
                console.error('Generation error:', error);
                setTyping(false);
                addMessage('assistant', `生成失败：${error.message}`);
                setStatus('error', '生成失败: ' + error.message);
            } finally {
                setTyping(false);
                state.isProcessing = false;
                elements.generateBtn.disabled = false;
            }
        }

        function playResponseVideo(videoUrl) {
            // 在切换前确保 idle 帧缓冲已保存
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                saveFrameBuffer('idle', activeIdle);
            }

            elements.responseVideo.src = videoUrl;
            elements.responseVideo.load();

            let hasStartedSwitch = false;

            const tryStartSwitch = () => {
                if (hasStartedSwitch) return;
                if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                    hasStartedSwitch = true;
                    // 先保存 response 第一帧到缓冲
                    saveFrameBuffer('response', elements.responseVideo);
                    // 暂停 idle 视频（节省资源，保持帧缓冲稳定）
                    elements.idleVideo.pause();
                    elements.idleVideo2.pause();
                    // 开始切换
                    state.showingResponse = true;
                    switchToResponseVideo();
                    // 播放视频
                    elements.responseVideo.play().catch(() => {});
                }
            };

            // 监听多个事件确保尽早开始
            elements.responseVideo.onloadeddata = () => {
                setTimeout(tryStartSwitch, 20);
            };
            elements.responseVideo.oncanplay = tryStartSwitch;
            elements.responseVideo.oncanplaythrough = tryStartSwitch;

            // 备用检查
            const checkReady = () => {
                if (!hasStartedSwitch) {
                    tryStartSwitch();
                    if (!hasStartedSwitch) {
                        setTimeout(checkReady, 50);
                    }
                }
            };
            setTimeout(checkReady, 100);
        }

        function setStatus(type, text) {
            elements.statusBar.className = 'status-bar ' + type;
            elements.statusBar.querySelector('.status-text').textContent = text;
            if (type === 'processing') {
                elements.progressBar.classList.add('active');
                startProgressAnimation();
            } else {
                elements.progressBar.classList.remove('active');
                stopProgressAnimation();
            }
        }

        function startProgressAnimation() {
            let currentProgress = 0;
            const steps = [15, 30, 50, 80, 95];
            let stepIndex = 0;
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (stepIndex >= steps.length) return;
                if (currentProgress < steps[stepIndex]) {
                    currentProgress += 1;
                    elements.progress.style.width = currentProgress + '%';
                } else {
                    stepIndex += 1;
                }
            }, 200);
        }

        function stopProgressAnimation() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            elements.progress.style.width = '0%';
        }

        function clearAll() {
            elements.userText.value = '';
            state.recordedBlob = null;
            state.recordedChunks = [];
            state.chatHistory = [];
            state.isTyping = false;
            state.lastSubmittedText = '';
            elements.audioPreview.style.display = 'none';
            elements.responseVideo.src = '';
            elements.responseVideo.load();
            state.showingResponse = false;
            state.crossfadeAlpha = 1.0;
            state.crossfadeTarget = 1.0;
            state.lastResponseFrame = null;
            metrics.total.textContent = '--';
            metrics.llm.textContent = '--';
            metrics.tts.textContent = '--';
            metrics.video.textContent = '--';
            renderChatHistory();
            playIdleVideo(state.currentAvatar);
            setStatus('ready', '准备就绪');
        }

        elements.userText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateVideo();
            }
        });

        init();
    </script>
</body>
