        async function switchMode(mode) {
            if (state.mode === mode) return;
            state.mode = mode;

            const btnChat  = document.getElementById('btnChatMode');
            const btnAgent = document.getElementById('btnAgentMode');

            if (mode === 'chat') {
                btnChat.className  = 'mode-btn active';
                btnAgent.className = 'mode-btn';
            } else {
                btnChat.className  = 'mode-btn';
                btnAgent.className = 'mode-btn active agent-mode';
                // 切换到 Agent 模式时立即检查后端健康状态
                await checkAgentBackendHealth();
            }
        }

        async function checkAgentBackendHealth() {
            try {
                const res = await fetch(`${state.agentBackendUrl}/health`, {
                    signal: AbortSignal.timeout(3000)
                });
                state.agentBackendOnline = res.ok;
            } catch {
                state.agentBackendOnline = false;
            }
            if (!state.agentBackendOnline) {
                showAgentBackendOfflineWarning();
            }
            return state.agentBackendOnline;
        }

        function showAgentBackendOfflineWarning() {
            showToast('⚠️ 还没有在本地启动 backend 程序，请你启动后再试', 'warning', 6000);
            addMessage('assistant', '⚠️ Agent 后端服务未启动。请运行：\n  cd live_talking_server/web/backend\n  npm run dev\n然后重新切换到 Agent 模式。');
        }

        function showToast(message, type = 'info', duration = 4000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;';
                document.body.appendChild(container);
            }
            const colorMap = { info: '#06b6d4', warning: '#38bdf8', error: '#06b6d4', success: '#0891b2' };
            const color = colorMap[type] || colorMap.info;
            const toast = document.createElement('div');
            toast.style.cssText = `padding:10px 16px;border-radius:10px;max-width:360px;background:rgba(248,250,252,0.97);color:${color};border-left:3px solid ${color};font-size:13px;line-height:1.5;box-shadow:0 4px 16px rgba(6,182,212,0.14);animation:slideIn 0.2s ease;white-space:pre-wrap;`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        async function dispatchUserInput() {
            if (state.mode === 'chat') {
                await generateVideo();
                return;
            }

            // Agent 模式：仅支持文字输入
            const activeTab = getActiveTabName();
            if (activeTab !== 'text') {
                showToast('Agent 模式仅支持文字输入，请切换到「文字输入」标签。', 'warning', 4000);
                return;
            }

            const text = elements.userText.value.trim();
            if (!text) {
                showToast('请输入内容', 'warning', 3000);
                return;
            }
            if (state.isProcessing) return;

            const online = await checkAgentBackendHealth();
            if (!online) return;

            elements.userText.value = '';
            elements.userText.style.height = '96px';
            addMessage('user', text);
            await agentModeDispatch(text);
        }

        async function agentModeDispatch(userText) {
            state.isProcessing = true;
            refreshGenerateButtonState();
            setTyping(true);
            setStatus('processing', 'Agent 正在处理...');

            // 关闭上一个 SSE 连接（如有）
            if (state.agentSseSource) {
                state.agentSseSource.close();
                state.agentSseSource = null;
            }

            try {
                const idempotencyKey = `create-task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
                const res = await fetch(`${state.agentBackendUrl}/api/assistant/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        taskType: 'book_train_ticket',
                        rawText: userText,
                        idempotencyKey
                    })
                });

                const payload = await res.json().catch(() => null);
                if (!res.ok || !payload || !payload.success) {
                    const errMsg = payload?.error?.message || `请求失败：${res.status}`;
                    addMessage('assistant', `❌ 任务提交失败：${errMsg}`);
                    state.isProcessing = false;
                    refreshGenerateButtonState();
                    setStatus('error', '任务提交失败');
                    return;
                }

                const { taskId, intent } = payload.data;
                state.agentCurrentTaskId = taskId;
                state.agentTaskIntent = intent || null;
                setTyping(false);
                subscribeAgentSSE(taskId);
                playWaitVideo(state.currentAvatar);

            } catch (e) {
                addMessage('assistant', `❌ 无法连接到 Agent 后端：${e.message}`);
                state.agentBackendOnline = false;
                setStatus('error', '连接 Agent 后端失败');
                state.isProcessing = false;
                refreshGenerateButtonState();
            } finally {
                setTyping(false);
            }
        }

        function subscribeAgentSSE(taskId) {
            const url = `${state.agentBackendUrl}/api/tasks/${taskId}/stream`;
            const source = new EventSource(url);
            state.agentSseSource = source;

            const seenSequences = new Set();

            // SSE 建立前后端可能已发布事件，立即拉取快照补全状态
            fetchAgentSnapshot(taskId).then(snapshot => {
                if (!snapshot?.task) return;
                const currentStatus = snapshot.task.status;
                state.agentTaskStatus = currentStatus;
                // 补渲已错过的事件消息
                (snapshot.recentEvents || []).forEach(ev => {
                    if (seenSequences.has(ev.sequenceId)) return;
                    seenSequences.add(ev.sequenceId);
                    if (ev.checkpointId) state.agentCheckpointId = ev.checkpointId;
                    const icon = ev.type === 'task_completed' ? '✅' :
                                 ev.type === 'task_failed'    ? '❌' :
                                 ev.type === 'task_cancelled' ? '🚫' : '⟳';
                    if (ev.message) addMessage('agent-step', `${icon} ${ev.message}`);
                });
                updateAgentActionPanel(currentStatus);
            });

            source.addEventListener('task_event', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (seenSequences.has(data.sequenceId)) return;
                    seenSequences.add(data.sequenceId);
                    handleAgentTaskEvent(data);
                } catch (err) {
                    console.error('[Agent] SSE event parse error:', err);
                }
            });

            source.onerror = () => {
                console.warn('[Agent] SSE connection error, browser will retry.');
            };
        }

        function handleAgentTaskEvent(data) {
            const { type, status, message, checkpointId, payload } = data;
            const TERMINAL_TYPES = ['task_completed', 'task_failed', 'task_cancelled'];

            // 保存最新 checkpointId 供动作按钮使用
            if (checkpointId) state.agentCheckpointId = checkpointId;
            state.agentTaskStatus = status;

            // 选择消息图标
            const icon = type === 'task_completed'   ? '✅' :
                         type === 'task_failed'      ? '❌' :
                         type === 'task_cancelled'   ? '🚫' :
                         type === 'browser_progress' ? '🌐' :
                         type === 'task_created'     ? '📋' : '⟳';

            if (message) {
                addMessage('agent-step', `${icon} ${message}`);
            }

            // 根据任务状态刷新动作面板
            updateAgentActionPanel(status);

            if (TERMINAL_TYPES.includes(type)) {
                stopWaitVideo();
                if (type === 'task_completed') {
                    setStatus('success', 'Agent 任务已完成');
                    if (payload?.receipt) renderAgentReceipt(payload.receipt);
                    if (payload?.avatar_video) playPresetAvatarVideo(payload.avatar_video);
                } else {
                    setStatus('error', type === 'task_failed' ? 'Agent 任务失败' : 'Agent 任务已取消');
                }

                hideAgentActionPanel();
                if (state.agentSseSource) {
                    state.agentSseSource.close();
                    state.agentSseSource = null;
                }
                state.agentCurrentTaskId = null;
                state.agentCheckpointId  = null;
                state.agentTaskStatus    = null;
                state.isProcessing = false;
                refreshGenerateButtonState();
            }
        }

        // ===== Agent 动作面板 =====

        function hideAgentActionPanel() {
            const panel = document.getElementById('agentActionPanel');
            if (panel) panel.style.display = 'none';
        }

        function showAgentActionPanel(html) {
            const panel = document.getElementById('agentActionPanel');
            if (!panel) return;
            panel.innerHTML = html;
            panel.style.display = 'block';
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function fetchAgentSnapshot(taskId) {
            try {
                const res = await fetch(`${state.agentBackendUrl}/api/tasks/${taskId}`);
                const payload = await res.json().catch(() => null);
                if (res.ok && payload?.success) return payload.data;
            } catch {}
            return null;
        }

        function agentApiCall(path, body) {
            const idempotencyKey = `action-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            return fetch(`${state.agentBackendUrl}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...body, idempotencyKey })
            }).then(r => r.json());
        }

        async function updateAgentActionPanel(status) {
            const taskId = state.agentCurrentTaskId;
            if (!taskId) return;

            switch (status) {

                case 'awaiting_slot_clarification': {
                    showAgentActionPanel(`
                        <div class="agent-action-title">❓ 需要补充信息</div>
                        <div class="agent-action-note">Agent 需要更多出行信息，请在对话框中补充（例如：出发地、目的地、日期等）。</div>
                        <div class="agent-action-btns">
                            <button class="btn-secondary" onclick="agentCancelTask()">取消订票</button>
                        </div>`);
                    break;
                }

                case 'awaiting_intent_confirmation': {
                    const intent = state.agentTaskIntent || {};
                    const fmt = v => v || '--';
                    const timeRange = intent.departureTimeLowerBound
                        ? `${intent.departureTimeLowerBound}${intent.departureTimeUpperBound ? ' ~ ' + intent.departureTimeUpperBound : ''}`
                        : '--';
                    showAgentActionPanel(`
                        <div class="agent-action-title">🎫 确认订票信息</div>
                        <div class="agent-intent-grid">
                            <div><label>出发地</label><span>${escapeHtml(fmt(intent.origin))}</span></div>
                            <div><label>目的地</label><span>${escapeHtml(fmt(intent.destination))}</span></div>
                            <div><label>日期</label><span>${escapeHtml(fmt(intent.travelDate))}</span></div>
                            <div><label>出发时间</label><span>${escapeHtml(timeRange)}</span></div>
                            <div><label>席别偏好</label><span>${escapeHtml((intent.seatPreferences || []).join('、') || '--')}</span></div>
                            <div><label>乘客</label><span>${escapeHtml((intent.passengerNames || []).join('、') || '默认乘客')}</span></div>
                        </div>
                        <div class="agent-action-btns">
                            <button class="btn-primary" onclick="agentConfirmIntent(true)">确认，开始查票</button>
                            <button class="btn-secondary" onclick="agentConfirmIntent(false)">信息有误，取消</button>
                        </div>`);
                    break;
                }

                case 'awaiting_candidate_confirmation': {
                    showAgentActionPanel(`<div class="agent-action-title">🚄 正在加载车次...</div>`);
                    const snapshot = await fetchAgentSnapshot(taskId);
                    const candidates = snapshot?.candidates || [];
                    if (!candidates.length) {
                        showAgentActionPanel(`
                            <div class="agent-action-title">🚄 未找到可用车次</div>
                            <div class="agent-action-note">当前路线暂无符合条件的余票，请调整出行条件后重试。</div>
                            <div class="agent-action-btns">
                                <button class="btn-secondary" onclick="agentCancelTask()">取消订票</button>
                            </div>`);
                        break;
                    }
                    const listHtml = candidates.map((c, i) => {
                        const recBadge = c.isRecommended ? '<span class="candidate-badge">推荐</span>' : '';
                        const seats = (c.seatInventory || [])
                            .filter(s => s.normalizedStatus === '有' || s.normalizedStatus === '数字')
                            .map(s => `<option value="${escapeHtml(s.seatType)}">${escapeHtml(s.seatType)} ${s.rawValue}</option>`)
                            .join('');
                        const seatSelect = seats
                            ? `<select class="candidate-seat-select" id="seatSel_${i}">${seats}</select>`
                            : '<span style="color:var(--text-light);font-size:11px;">无余票</span>';
                        return `
                            <div class="agent-candidate-item" id="cand_${i}" onclick="agentSelectCandidateRow(${i}, '${escapeHtml(c.trainNo)}')">
                                <span class="candidate-train-no">${escapeHtml(c.trainNo)}</span>
                                <span class="candidate-times">${escapeHtml(c.departureTime)} → ${escapeHtml(c.arrivalTime)}</span>
                                <span class="candidate-duration">${escapeHtml(c.durationText)}</span>
                                ${recBadge}
                                ${seatSelect}
                            </div>`;
                    }).join('');
                    state.agentSelectedCandidate = { trainNo: null, seatType: null };
                    showAgentActionPanel(`
                        <div class="agent-action-title">🚄 选择车次（共 ${candidates.length} 趟）</div>
                        <div class="agent-candidate-list">${listHtml}</div>
                        <div class="agent-action-btns">
                            <button class="btn-primary" id="btnConfirmCandidate" onclick="agentConfirmCandidate()" disabled>确认选择</button>
                            <button class="btn-secondary" onclick="agentCancelTask()">取消订票</button>
                        </div>`);
                    break;
                }

                case 'login_required':
                case 'awaiting_human_verification': {
                    const isLogin = status === 'login_required';
                    showAgentActionPanel(`
                        <div class="agent-action-title">${isLogin ? '🔐 需要扫码登录' : '🔍 需要人工验证'}</div>
                        <div class="agent-action-note">${isLogin
                            ? '12306 自动化浏览器已打开，请切换到该浏览器窗口完成扫码登录，完成后点击下方按钮继续。'
                            : '需要完成验证码或短信验证，请在弹出的浏览器窗口操作，完成后点击下方按钮。'}</div>
                        <div class="agent-action-btns">
                            <button class="btn-primary" onclick="agentHumanStepDone('${isLogin ? 'complete_qr_login' : 'complete_captcha'}')">已完成${isLogin ? '扫码' : '验证'}</button>
                            <button class="btn-secondary" onclick="agentCancelTask()">取消</button>
                        </div>`);
                    break;
                }

                case 'awaiting_final_submit_confirmation': {
                    showAgentActionPanel(`
                        <div class="agent-action-title">📋 确认提交订单</div>
                        <div class="agent-action-note">Agent 已填写完订单信息，请确认是否立即提交。提交后将进入支付环节。</div>
                        <div class="agent-action-btns">
                            <button class="btn-primary" onclick="agentConfirmSubmit(true)">确认提交</button>
                            <button class="btn-secondary" onclick="agentConfirmSubmit(false)">放弃</button>
                        </div>`);
                    break;
                }

                case 'awaiting_payment': {
                    showAgentActionPanel(`
                        <div class="agent-action-title">💳 等待支付</div>
                        <div class="agent-action-note">请在弹出的 12306 浏览器窗口完成支付，完成后点击下方按钮。</div>
                        <div class="agent-action-btns">
                            <button class="btn-primary" onclick="agentCompletePayment()">已完成支付</button>
                            <button class="btn-secondary" onclick="agentCancelTask()">取消</button>
                        </div>`);
                    break;
                }

                default:
                    hideAgentActionPanel();
            }
        }

        function agentSelectCandidateRow(index, trainNo) {
            document.querySelectorAll('.agent-candidate-item').forEach(el => el.classList.remove('selected'));
            const row = document.getElementById(`cand_${index}`);
            if (row) row.classList.add('selected');
            const seatSel = document.getElementById(`seatSel_${index}`);
            state.agentSelectedCandidate = {
                trainNo,
                seatType: seatSel ? seatSel.value : null
            };
            const confirmBtn = document.getElementById('btnConfirmCandidate');
            if (confirmBtn) confirmBtn.disabled = false;
        }

        async function agentConfirmIntent(confirmed) {
            hideAgentActionPanel();
            const taskId = state.agentCurrentTaskId;
            if (!taskId) return;
            try {
                await agentApiCall(`/api/tasks/${taskId}/confirm-intent`, { confirmed });
                addMessage('agent-step', confirmed ? '✅ 已确认订票意图，开始查票...' : '🚫 已取消订票');
            } catch (e) {
                addMessage('assistant', `❌ 确认意图失败：${e.message}`);
            }
        }

        async function agentConfirmCandidate() {
            const { trainNo, seatType } = state.agentSelectedCandidate;
            if (!trainNo || !seatType) {
                showToast('请先选择车次和席别', 'warning', 3000);
                return;
            }
            hideAgentActionPanel();
            const taskId = state.agentCurrentTaskId;
            if (!taskId) return;
            try {
                await agentApiCall(`/api/tasks/${taskId}/confirm-candidate`, {
                    candidateTrainNo: trainNo,
                    seatType,
                    allowWaitlist: false
                });
                addMessage('agent-step', `✅ 已选择 ${trainNo}（${seatType}），正在推进订票...`);
            } catch (e) {
                addMessage('assistant', `❌ 选择车次失败：${e.message}`);
            }
        }

        async function agentHumanStepDone(actionType) {
            const taskId = state.agentCurrentTaskId;
            const checkpointId = state.agentCheckpointId;
            if (!taskId || !checkpointId) return;
            hideAgentActionPanel();
            try {
                await agentApiCall(`/api/tasks/${taskId}/human-step-done`, {
                    checkpointId,
                    actionType
                });
                addMessage('agent-step', '✅ 已通知 Agent 继续执行...');
            } catch (e) {
                addMessage('assistant', `❌ 操作失败：${e.message}`);
            }
        }

        async function agentConfirmSubmit(confirmed) {
            const taskId = state.agentCurrentTaskId;
            const checkpointId = state.agentCheckpointId;
            if (!taskId || !checkpointId) return;
            hideAgentActionPanel();
            try {
                await agentApiCall(`/api/tasks/${taskId}/confirm-submit`, { checkpointId, confirmed });
                addMessage('agent-step', confirmed ? '✅ 已确认提交，等待出票...' : '🚫 已放弃提交');
            } catch (e) {
                addMessage('assistant', `❌ 操作失败：${e.message}`);
            }
        }

        async function agentCompletePayment() {
            const taskId = state.agentCurrentTaskId;
            const checkpointId = state.agentCheckpointId;
            if (!taskId || !checkpointId) return;
            hideAgentActionPanel();
            try {
                await agentApiCall(`/api/tasks/${taskId}/complete-payment`, { checkpointId });
                addMessage('agent-step', '✅ 已确认支付完成');
            } catch (e) {
                addMessage('assistant', `❌ 操作失败：${e.message}`);
            }
        }

        async function agentCancelTask() {
            const taskId = state.agentCurrentTaskId;
            if (!taskId) return;
            hideAgentActionPanel();
            try {
                await agentApiCall(`/api/tasks/${taskId}/cancel`, { reason: '用户主动取消' });
                addMessage('agent-step', '🚫 订票任务已取消');
            } catch (e) {
                addMessage('assistant', `❌ 取消失败：${e.message}`);
            }
        }

        // ===== Agent 等待视频 =====

        const WAIT_VIDEO_MAP = {
            'human_1': '/human_choice/wait1.mp4',
            'human_2': '/human_choice/wait2.mp4'
        };

        /**
         * Agent 模式等待中：循环播放当前数字人的等待视频
         * @param {string} avatarId - 'human_1' | 'human_2'
         */
        function playWaitVideo(avatarId) {
            const url = WAIT_VIDEO_MAP[avatarId];
            if (!url) return;
            // 延迟 1.5 秒后播放，只播一次
            state.waitVideoTimer = setTimeout(() => {
                state.waitVideoTimer = null;
                state.isWaitVideoPlaying = true;
                playResponseVideo(url);
            }, 1500);
        }

        /**
         * Agent 任务结束时停止等待视频，恢复 idle
         */
        function stopWaitVideo() {
            // 若还在等待延迟，直接取消
            if (state.waitVideoTimer) {
                clearTimeout(state.waitVideoTimer);
                state.waitVideoTimer = null;
            }
            if (!state.isWaitVideoPlaying) return;
            state.isWaitVideoPlaying = false;
            // 视频正在播放则立即切回 idle
            if (state.showingResponse) {
                onResponseVideoEnded();
            }
        }

        /**
         * 【扩展接口】播放预制数字人视频
         * videoRef 可为完整 URL、相对路径或预设 key
         */
        async function playPresetAvatarVideo(videoRef) {
            const PRESET_VIDEO_MAP = {
                'booking_confirm': '/videos/preset/booking_confirm.mp4',
                'booking_cancel':  '/videos/preset/booking_cancel.mp4',
                'greeting':        '/videos/preset/greeting.mp4'
            };

            let videoUrl = PRESET_VIDEO_MAP[videoRef] || videoRef;
            if (!videoUrl.startsWith('http')) {
                const port = window.MAIN_SERVER_PORT || 8010;
                videoUrl = `http://localhost:${port}${videoUrl}`;
            }

            try {
                playResponseVideo(videoUrl);
            } catch (e) {
                console.warn('[Agent] 预制视频播放失败，跳过：', e.message);
            }
        }

        /**
         * 在对话框中渲染订单回执卡片
         */
        function renderAgentReceipt(receipt) {
            const el = document.createElement('div');
            el.className = 'agent-receipt-card';
            el.innerHTML = `
                <div class="receipt-route">
                    <span class="city">${escapeHtml(receipt.from || '--')}</span>
                    <span class="arrow">→</span>
                    <span class="city">${escapeHtml(receipt.to || '--')}</span>
                </div>
                <div class="receipt-grid">
                    <div><label>日期</label><span>${escapeHtml(receipt.date || '--')}</span></div>
                    <div><label>车次</label><span>${escapeHtml(receipt.trainNo || '--')}</span></div>
                    <div><label>座位</label><span>${escapeHtml(receipt.seat || '--')}</span></div>
                    <div><label>票价</label><span>${escapeHtml(receipt.price || '--')}</span></div>
                </div>
                ${receipt.orderNo ? `<div class="receipt-order-no">订单号：${escapeHtml(receipt.orderNo)}</div>` : ''}
            `;
            elements.chatHistory.appendChild(el);
            elements.chatHistory.scrollTop = elements.chatHistory.scrollHeight;
        }

        elements.userText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                dispatchUserInput();
            }
        });

        init();
    </script>
</body>
