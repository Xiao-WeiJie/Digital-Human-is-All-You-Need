        function initCanvasRenderer() {
            ctx = elements.renderCanvas.getContext('2d');
            resizeCanvasToContainer();
            state.offscreenCanvas = document.createElement('canvas');
            state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            syncOffscreenCanvas();
            startRenderLoop();
            window.addEventListener('resize', resizeCanvasToContainer);
        }

        function resizeCanvasToContainer() {
            const rect = elements.videoContainer.getBoundingClientRect();
            const nextWidth = Math.max(1, Math.floor(rect.width || canvasWidth));
            const nextHeight = Math.max(1, Math.floor(rect.height || canvasHeight));

            if (nextWidth === canvasWidth && nextHeight === canvasHeight) return;

            canvasWidth = nextWidth;
            canvasHeight = nextHeight;
            elements.renderCanvas.width = canvasWidth;
            elements.renderCanvas.height = canvasHeight;
            syncOffscreenCanvas();
        }

        function syncOffscreenCanvas() {
            if (!state.offscreenCanvas) return;
            state.offscreenCanvas.width = canvasWidth;
            state.offscreenCanvas.height = canvasHeight;
        }

        function updateVideoAspectRatio(video) {
            if (video.videoWidth && video.videoHeight) {
                elements.videoContainer.style.aspectRatio = DISPLAY_ASPECT_RATIO_CSS;
                requestAnimationFrame(resizeCanvasToContainer);
            }
        }

        function getCoverDrawRect(videoWidth, videoHeight) {
            const scale = Math.max(canvasWidth / videoWidth, canvasHeight / videoHeight);
            const drawWidth = videoWidth * scale;
            const drawHeight = videoHeight * scale;

            return {
                drawWidth,
                drawHeight,
                dx: (canvasWidth - drawWidth) / 2,
                dy: (canvasHeight - drawHeight) / 2
            };
        }

        function drawVideoContain(video, alpha) {
            if (!video || video.readyState < 2 || alpha <= 0) return false;
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                ctx.globalAlpha = alpha;
                ctx.drawImage(video, dx, dy, drawWidth, drawHeight);
                ctx.globalAlpha = 1;
                return true;
            } catch (e) {
                ctx.globalAlpha = 1;
                return false;
            }
        }

        function startRenderLoop() {
            const render = () => {
                renderFrame();
                state.animationFrameId = requestAnimationFrame(render);
            };
            render();
        }

        function renderFrame() {
            if (!ctx) return;

            // 淡入淡出速度
            const fadeSpeed = 0.08;
            if (state.crossfadeAlpha < state.crossfadeTarget) {
                state.crossfadeAlpha = Math.min(state.crossfadeAlpha + fadeSpeed, state.crossfadeTarget);
            } else if (state.crossfadeAlpha > state.crossfadeTarget) {
                state.crossfadeAlpha = Math.max(state.crossfadeAlpha - fadeSpeed, state.crossfadeTarget);
            }

            const idleFadeSpeed = 0.1;
            if (state.idleCrossfadeAlpha < 1.0 && state.isIdleCrossfading) {
                state.idleCrossfadeAlpha = Math.min(state.idleCrossfadeAlpha + idleFadeSpeed, 1.0);
                if (state.idleCrossfadeAlpha >= 1.0) state.isIdleCrossfading = false;
            }

            // 确保离屏 canvas 存在且尺寸正确
            if (!state.offscreenCanvas) {
                state.offscreenCanvas = document.createElement('canvas');
                state.offscreenCtx = state.offscreenCanvas.getContext('2d');
            }
            if (state.offscreenCanvas.width !== canvasWidth || state.offscreenCanvas.height !== canvasHeight) {
                state.offscreenCanvas.width = canvasWidth;
                state.offscreenCanvas.height = canvasHeight;
            }

            const offCtx = state.offscreenCtx;

            // ========== 清空并填充黑色背景 ==========
            offCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            offCtx.fillStyle = '#140f0c';
            offCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;

            // ========== 绘制 IDLE 层 ==========
            const idleAlpha = state.crossfadeAlpha;
            if (idleAlpha > 0.001) {
                if (state.isIdleCrossfading) {
                    // Crossfade 模式：旧视频淡出，新视频淡入
                    // 帧缓冲作为新视频还没准备好时的兜底

                    // 1. 绘制旧视频/帧缓冲淡出
                    const outAlpha = idleAlpha * (1 - state.idleCrossfadeAlpha);
                    if (outAlpha > 0.01) {
                        // 优先绘制旧视频
                        if (inactiveIdle.readyState >= 2 && inactiveIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, inactiveIdle, outAlpha);
                        } else if (state.idleFrameBuffer) {
                            // 旧视频不可用时用帧缓冲
                            offCtx.globalAlpha = outAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }

                    // 2. 绘制新视频淡入
                    const inAlpha = idleAlpha * state.idleCrossfadeAlpha;
                    if (inAlpha > 0.01) {
                        if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                            drawVideoToContext(offCtx, activeIdle, inAlpha);
                            // 更新帧缓冲为新视频
                            saveFrameBuffer('idle', activeIdle);
                        } else if (state.idleFrameBuffer) {
                            // 新视频不可用时用帧缓冲
                            offCtx.globalAlpha = inAlpha;
                            offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                            offCtx.globalAlpha = 1;
                        }
                    }
                } else {
                    // 正常模式：帧缓冲打底 + 视频覆盖
                    if (state.idleFrameBuffer) {
                        offCtx.globalAlpha = idleAlpha;
                        offCtx.drawImage(state.idleFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                        offCtx.globalAlpha = 1;
                    }
                    if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                        drawVideoToContext(offCtx, activeIdle, idleAlpha);
                        saveFrameBuffer('idle', activeIdle);
                    }
                }
            }

            // ========== 绘制 RESPONSE 层 ==========
            const responseAlpha = 1 - state.crossfadeAlpha;
            if (responseAlpha > 0.001) {
                // 帧缓冲打底
                if (state.responseFrameBuffer) {
                    offCtx.globalAlpha = responseAlpha;
                    offCtx.drawImage(state.responseFrameBuffer, 0, 0, canvasWidth, canvasHeight);
                    offCtx.globalAlpha = 1;
                }
                // 视频覆盖
                if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                    drawVideoToContext(offCtx, elements.responseVideo, responseAlpha);
                    saveFrameBuffer('response', elements.responseVideo);
                }
            }

            // ========== 绘制到主 canvas ==========
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(state.offscreenCanvas, 0, 0);
        }

        // 绘制视频到指定 context
        function drawVideoToContext(targetCtx, video, alpha) {
            if (!video || video.readyState < 2 || alpha <= 0.01) return false;
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH) return false;

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                targetCtx.globalAlpha = alpha;
                targetCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
                targetCtx.globalAlpha = 1;
                return true;
            } catch (e) {
                targetCtx.globalAlpha = 1;
                return false;
            }
        }

        // 保存帧缓冲
        function saveFrameBuffer(type, video) {
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            if (!vW || !vH || canvasWidth <= 0 || canvasHeight <= 0) return;

            const bufferKey = type + 'FrameBuffer';
            if (!state[bufferKey]) {
                state[bufferKey] = document.createElement('canvas');
            }
            // 确保帧缓冲尺寸与主 canvas 匹配
            if (state[bufferKey].width !== canvasWidth || state[bufferKey].height !== canvasHeight) {
                state[bufferKey].width = canvasWidth;
                state[bufferKey].height = canvasHeight;
            }

            const bufferCtx = state[bufferKey].getContext('2d');
            bufferCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            bufferCtx.fillStyle = '#140f0c';
            bufferCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            const { drawWidth, drawHeight, dx, dy } = getCoverDrawRect(vW, vH);

            try {
                bufferCtx.drawImage(video, dx, dy, drawWidth, drawHeight);
            } catch (e) {}
        }

        function switchToResponseVideo() {
            state.crossfadeTarget = 0.0;
        }

        function switchToIdleVideo() {
            state.crossfadeTarget = 1.0;
        }

        const IDLE_CROSSFADE_TIME = 0.3;

        function initIdleVideoEvents(video, videoNum) {
            video.addEventListener('loadedmetadata', () => updateVideoAspectRatio(video));

            video.addEventListener('timeupdate', () => {
                if (state.showingResponse) return;
                const remainingTime = video.duration - video.currentTime;
                const isActive = state.activeIdleVideo === videoNum;
                if (isActive && remainingTime < IDLE_CROSSFADE_TIME && !state.isIdleCrossfading) {
                    const otherVideo = videoNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    const otherNum = videoNum === 1 ? 2 : 1;
                    if (otherVideo.readyState >= 2) {
                        // 在切换前保存当前帧到缓冲
                        if (video.readyState >= 2 && video.videoWidth > 0) {
                            saveFrameBuffer('idle', video);
                        }
                        state.isIdleCrossfading = true;
                        state.activeIdleVideo = otherNum;
                        // 从 1.0 开始，让新视频逐渐淡入覆盖旧帧
                        state.idleCrossfadeAlpha = 0.0;
                        otherVideo.currentTime = 0;
                        otherVideo.play().catch(() => {});
                    }
                }
            });

            video.addEventListener('ended', () => {
                if (state.showingResponse) return;
                const localNum = video === elements.idleVideo ? 1 : 2;
                if (state.activeIdleVideo !== localNum) {
                    video.currentTime = 0;
                    video.pause();
                } else {
                    const otherVideo = localNum === 1 ? elements.idleVideo2 : elements.idleVideo;
                    // 在切换前保存当前帧到缓冲
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        saveFrameBuffer('idle', video);
                    }
                    state.activeIdleVideo = localNum === 1 ? 2 : 1;
                    state.idleCrossfadeAlpha = 0.0;
                    state.isIdleCrossfading = true;
                    otherVideo.currentTime = 0;
                    otherVideo.play().catch(() => {});
                }
            });

            video.addEventListener('pause', () => {
                if (!state.showingResponse && state.activeIdleVideo === videoNum) {
                    video.play().catch(() => {});
                }
            });
        }

            elements.emotionActionGroup.classList.toggle('hidden', !isEmotionTab);
            elements.tongueActionGroup.classList.toggle('hidden', !isTongueTab);
            elements.rightPanel?.classList.toggle('emotion-mode', isEmotionTab);
            elements.rightPanel?.classList.toggle('tongue-mode', isTongueTab);
            if (isTongueTab) {
                updateTongueActionArea();
            }
        }

        function setEmotionTalkButtonState({ recording = false, text = '按住并说话' } = {}) {
            elements.emotionTalkBtn.classList.toggle('recording', recording);
            elements.emotionTalkBtn.textContent = text;
        }

        const TONGUE_GUIDE_TEXT = '请伸出舌头对准摄像头，确认后请点击“进行诊断”';

        function setTongueStatus(text, isError = false) {
            if (!elements.tongueStatus) return;
            elements.tongueStatus.textContent = text;
            elements.tongueStatus.classList.toggle('error', isError);
        }

        function clearTongueDiagnosisResult() {
            state.tongueDiagnosis.lastResult = null;
            if (!elements.tongueResult) return;
            elements.tongueColorValue.textContent = '--';
            elements.tongueCoatValue.textContent = '--';
            elements.tongueThicknessValue.textContent = '--';
            elements.tongueGreasinessValue.textContent = '--';
            elements.tongueResultTip.textContent = '本次结果仅供辅助参考';
            elements.tongueResult.classList.add('hidden');
        }

        function getTongueGuideText(phase = state.tongueDiagnosis.phase) {
            switch (phase) {
                case 'preview':
                    return TONGUE_GUIDE_TEXT;
                case 'diagnosing':
                    return '正在分析当前画面，请稍候...';
                case 'done':
                    return '诊断完成，如需重新分析请点击“再次诊断”。';
                case 'error':
                    return '请调整取景后重试，或关闭摄像头。';
                case 'idle':
                default:
                    return '点击“开始诊断”后显示预览。';
            }
        }

        function renderTongueDiagnosisState() {
            if (!elements.tongueGuide) return;

            elements.tongueGuide.textContent = getTongueGuideText();
            elements.tongueCameraOverlay.style.display = state.tongueDiagnosis.stream ? 'none' : 'flex';
            elements.tongueResult.classList.toggle(
                'hidden',
                !(state.tongueDiagnosis.phase === 'done' && state.tongueDiagnosis.lastResult)
            );
            updateTongueActionArea();
        }

        function updateTongueActionArea() {
            if (!elements.tongueStartBtn) return;

            const { phase, stream, requestPending } = state.tongueDiagnosis;
            const busy = state.isProcessing || (state.mockMode.enabled && state.responsePlayback.busy) || requestPending;
            const hasStream = !!stream;

            elements.tongueConfirmBtn.textContent = phase === 'diagnosing' ? '诊断中...' : '进行诊断';

            elements.tongueStartBtn.classList.toggle('hidden', phase !== 'idle');
            elements.tongueConfirmBtn.classList.toggle('hidden', !['preview', 'diagnosing'].includes(phase));
            elements.tongueRedoBtn.classList.toggle('hidden', !['done', 'error'].includes(phase));
            elements.tongueStopBtn.classList.toggle('hidden', !hasStream || !['preview', 'done', 'error', 'diagnosing'].includes(phase));

            elements.tongueStartBtn.disabled = busy;
            elements.tongueConfirmBtn.disabled = busy || phase !== 'preview';
            elements.tongueRedoBtn.disabled = busy;
            elements.tongueStopBtn.disabled = busy || phase === 'diagnosing';
        }

        function stopEmotionCameraForTabSwitch() {
            if (state.mockMode.enabled) {
                if (state.emotionTrigger.cameraStream) {
                    stopMockEmotionCapture();
                }
            } else if (emotionCapture && emotionCapture.isRunning) {
                emotionCapture.stop();
            }

            if (elements.emotionEnabled.checked) {
                elements.emotionEnabled.checked = false;
            }
        }

        function resetTongueDiagnosisState({ keepStream = false, phase = 'idle', statusText = '未开始' } = {}) {
            state.tongueDiagnosis.requestPending = false;
            state.tongueDiagnosis.lastCapturedImage = null;
            state.tongueDiagnosis.requestId += 1;

            if (!keepStream && state.tongueDiagnosis.stream) {
                state.tongueDiagnosis.stream.getTracks().forEach(track => track.stop());
                state.tongueDiagnosis.stream = null;
            }

            if (!keepStream && elements.tongueCamera) {
                elements.tongueCamera.srcObject = null;
            }

            state.tongueDiagnosis.phase = phase;
            clearTongueDiagnosisResult();
            setTongueStatus(statusText);
            renderTongueDiagnosisState();
        }

        function initTongueDiagnosis() {
            if (!elements.tongueCamera || !elements.tongueStartBtn) return;

            clearTongueDiagnosisResult();
            state.tongueDiagnosis.phase = 'idle';
            setTongueStatus('未开始');
            renderTongueDiagnosisState();

            elements.tongueStartBtn.addEventListener('click', startTonguePreview);
            elements.tongueConfirmBtn.addEventListener('click', performTongueDiagnosis);
            elements.tongueRedoBtn.addEventListener('click', () => {
                if (state.tongueDiagnosis.stream) {
                    resetTongueDiagnosisForRedo();
                } else {
                    startTonguePreview();
                }
            });
            elements.tongueStopBtn.addEventListener('click', () => stopTonguePreview());
        }

        async function startTonguePreview() {
            if (state.tongueDiagnosis.requestPending) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                state.tongueDiagnosis.phase = 'error';
                clearTongueDiagnosisResult();
                setTongueStatus('浏览器不支持摄像头访问', true);
                renderTongueDiagnosisState();
                return;
            }

            try {
                stopEmotionCameraForTabSwitch();

                if (!state.tongueDiagnosis.stream) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        },
                        audio: false
                    });

                    state.tongueDiagnosis.stream = stream;
                    elements.tongueCamera.srcObject = stream;
                    await elements.tongueCamera.play();
                }

                clearTongueDiagnosisResult();
                state.tongueDiagnosis.phase = 'preview';
                setTongueStatus('摄像头已开启，请确认取景');
                renderTongueDiagnosisState();
            } catch (error) {
                console.error('[Tongue] Failed to start preview:', error);
                state.tongueDiagnosis.phase = 'error';
                clearTongueDiagnosisResult();

                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    setTongueStatus('无法访问摄像头，请在浏览器设置中允许摄像头权限', true);
                } else {
                    setTongueStatus('摄像头启动失败，请检查设备是否被占用', true);
                }

                renderTongueDiagnosisState();
            }
        }

        function captureTongueFrame() {
            const video = elements.tongueCamera;
            if (!video || !state.tongueDiagnosis.stream) {
                throw new Error('摄像头尚未开启');
            }
            if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
                throw new Error('摄像头画面尚未准备好');
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.92);
        }

        async function requestTongueDiagnosis(base64Image) {
            const response = await fetch('/api/v1/tongue/detect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: base64Image,
                    session_id: state.currentSessionId || 'default'
                })
            });

            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                throw new Error('舌诊服务返回了无效响应');
            }

            if (!response.ok) {
                throw new Error(payload?.msg || `舌诊请求失败（${response.status}）`);
            }
            if (!payload || payload.code !== 0 || !payload.data) {
                throw new Error(payload?.msg || '舌诊失败');
            }

            return payload.data;
        }

        function renderTongueDiagnosisResult(result) {
            state.tongueDiagnosis.lastResult = result;
            elements.tongueColorValue.textContent = result.tongue_color || '--';
            elements.tongueCoatValue.textContent = result.coat_color || '--';
            elements.tongueThicknessValue.textContent = result.thickness || '--';
            elements.tongueGreasinessValue.textContent = result.greasiness || '--';
            elements.tongueResultTip.textContent = result.advice || '本次结果仅供辅助参考';
            elements.tongueResult.classList.remove('hidden');
        }

        async function performTongueDiagnosis() {
            if (state.tongueDiagnosis.phase !== 'preview' || state.tongueDiagnosis.requestPending) return;

            let base64Image = '';
            try {
                base64Image = captureTongueFrame();
            } catch (error) {
                state.tongueDiagnosis.phase = 'error';
                clearTongueDiagnosisResult();
                setTongueStatus(error.message || '无法读取摄像头画面', true);
                renderTongueDiagnosisState();
                return;
            }

            state.tongueDiagnosis.requestPending = true;
            state.tongueDiagnosis.lastCapturedImage = base64Image;
            state.tongueDiagnosis.phase = 'diagnosing';
            const requestId = state.tongueDiagnosis.requestId + 1;
            state.tongueDiagnosis.requestId = requestId;
            setTongueStatus('诊断中...', false);
            renderTongueDiagnosisState();

            try {
                const result = await requestTongueDiagnosis(base64Image);
                if (requestId !== state.tongueDiagnosis.requestId) return;

                renderTongueDiagnosisResult(result);
                state.tongueDiagnosis.phase = 'done';
                setTongueStatus('诊断完成');
            } catch (error) {
                if (requestId !== state.tongueDiagnosis.requestId) return;

                clearTongueDiagnosisResult();
                state.tongueDiagnosis.phase = 'error';
                setTongueStatus(error.message || '舌诊服务暂时不可用，请稍后重试', true);
            } finally {
                if (requestId === state.tongueDiagnosis.requestId) {
                    state.tongueDiagnosis.requestPending = false;
                    renderTongueDiagnosisState();
                }
            }
        }

        function resetTongueDiagnosisForRedo() {
            state.tongueDiagnosis.requestPending = false;
            state.tongueDiagnosis.lastCapturedImage = null;
            clearTongueDiagnosisResult();
            state.tongueDiagnosis.phase = state.tongueDiagnosis.stream ? 'preview' : 'idle';
            setTongueStatus(state.tongueDiagnosis.stream ? '请确认取景后进行诊断' : '未开始');
            renderTongueDiagnosisState();
        }

        function stopTonguePreview() {
            resetTongueDiagnosisState({ keepStream: false, phase: 'idle', statusText: '未开始' });
        }

        function clearRecordedAudioPreview() {
            if (state.recordedAudioUrl) {
                URL.revokeObjectURL(state.recordedAudioUrl);
                state.recordedAudioUrl = null;
            }
            elements.recordedAudio.removeAttribute('src');
            elements.audioPreview.style.display = 'none';
        }

        function updateRecordedAudioPreview(blob) {
            clearRecordedAudioPreview();
            if (!blob || !blob.size) return;
            state.recordedAudioUrl = URL.createObjectURL(blob);
            elements.recordedAudio.src = state.recordedAudioUrl;
            elements.audioPreview.style.display = 'block';
        }

        function resetEmotionTriggerSession() {
            clearEmotionTriggerState({ resetTriggered: true });
        }

        function playManagedResponseVideo({ videoUrl, source, deleteAfterPlay = false, filename = null }) {
            clearResponseCleanupTimers();
            state.responsePlayback.busy = true;
            state.responsePlayback.source = source;
            state.responsePlayback.deleteAfterPlay = deleteAfterPlay;
            state.responsePlayback.filename = filename;
            state.currentVideoFilename = deleteAfterPlay ? filename : null;
            playResponseVideo(videoUrl);
            refreshGenerateButtonState();
        }

        function getEmotionReactionDelayMs() {
            const minDelay = Number(state.emotionFirstReaction.delayMinMs) || 2000;
            const maxDelay = Number(state.emotionFirstReaction.delayMaxMs) || minDelay;
            const safeMinDelay = Math.max(0, Math.min(minDelay, maxDelay));
            const safeMaxDelay = Math.max(safeMinDelay, maxDelay);
            return safeMinDelay + Math.floor(Math.random() * (safeMaxDelay - safeMinDelay + 1));
        }

        function isHappyDominantEmotion(emotion) {
            const scores = emotion?.emotion_scores || {};
            const scoreEntries = Object.entries(scores)
                .map(([key, value]) => [key, Number(value) || 0]);

            if (scoreEntries.length === 0) {
                return (emotion?.dominant_emotion || '').toLowerCase() === 'happy';
            }

            const maxScore = scoreEntries.reduce((max, [, value]) => Math.max(max, value), 0);
            if (maxScore <= 0) {
                return (emotion?.dominant_emotion || '').toLowerCase() === 'happy';
            }
            const happyScore = Number(scores.happy) || 0;
            return happyScore >= maxScore;
        }

        function buildEmotionReactionPayload(emotion) {
            if (!state.emotionFirstReaction.enabled) return null;

            const avatarId = state.currentAvatar;
            const avatar = state.avatars[avatarId];
            if (!avatar) return null;

            const reactionType = isHappyDominantEmotion(emotion) ? 'happy' : 'sad';
            const videoUrl = avatar.emotion_reaction_videos?.[reactionType];
            const replyText = reactionType === 'happy'
                ? state.emotionFirstReaction.happyReply
                : state.emotionFirstReaction.sadReply;

            if (!videoUrl || !replyText) {
                console.warn('[Emotion] Missing first-reaction config for avatar:', avatarId, reactionType);
                return null;
            }

            return {
                avatarId,
                reactionType,
                videoUrl,
                replyText
            };
        }

        function playEmotionReactionPayload(payload) {
            if (!payload) return false;
            if (!elements.emotionEnabled.checked) return false;

            setStatus('success', '已识别到情绪');
            addMessage('assistant', payload.replyText);
            playManagedResponseVideo({
                videoUrl: payload.videoUrl + '?t=' + Date.now(),
                source: 'emotion-first',
                deleteAfterPlay: false,
                filename: null
            });
            return true;
        }

        function maybeTriggerFirstEmotionReaction(emotion) {
            if (state.mockMode.enabled) return;
            if (!elements.emotionEnabled.checked) return;
            if (state.emotionTrigger.hasTriggeredInCurrentCameraSession) return;

            const payload = buildEmotionReactionPayload(emotion);
            if (!payload) return;

            state.emotionTrigger.hasTriggeredInCurrentCameraSession = true;
            state.emotionFirstReaction.pending = null;
            clearEmotionFirstReactionTimer();

            setStatus('processing', '已识别到情绪，正在思考中...');

            state.emotionFirstReaction.timer = setTimeout(() => {
                state.emotionFirstReaction.timer = null;

                if (!elements.emotionEnabled.checked) return;

                if (state.responsePlayback.busy || state.isProcessing || state.mockMode.isMockPlaying) {
                    state.emotionFirstReaction.pending = payload;
                    setStatus('processing', '已识别到情绪，等待当前任务完成...');
                    return;
                }

                playEmotionReactionPayload(payload);
            }, getEmotionReactionDelayMs());
        }

        function tryPlayPendingEmotionVideo() {
            if (state.responsePlayback.busy || state.isProcessing || state.mockMode.isMockPlaying) return false;

            if (state.emotionFirstReaction.pending) {
                const pendingReaction = state.emotionFirstReaction.pending;
                state.emotionFirstReaction.pending = null;
                return playEmotionReactionPayload(pendingReaction);
            }

            if (!state.mockMode.enabled) return false;
            if (!state.emotionTrigger.enabled || !state.emotionTrigger.videoUrl) return false;
            if (!state.emotionTrigger.pending) return false;

            state.emotionTrigger.pending = false;
            setStatus('success', '已识别到情绪');
            playManagedResponseVideo({
                videoUrl: state.emotionTrigger.videoUrl + '?t=' + Date.now(),
                source: 'emotion-first',
                deleteAfterPlay: false,
                filename: null
            });
            return true;
        }

        function onResponseVideoEnded() {
            // 立即保存 response 最后一帧
            if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                saveFrameBuffer('response', elements.responseVideo);
            }

            // idle 帧缓冲在 playResponseVideo 时已保存，这里不需要更新
            // 只需要恢复 idle 视频播放

            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.paused) {
                activeIdle.play().catch(() => {});
            }

            state.showingResponse = false;
            switchToIdleVideo();

            const shouldDeleteVideo = state.responsePlayback.deleteAfterPlay && state.responsePlayback.filename;
            if (shouldDeleteVideo) {
                deletePlayedVideo(state.responsePlayback.filename);
            }

            resetResponsePlaybackState();

            if (tryPlayPendingEmotionVideo()) {
                return;
            }

            scheduleResponseCleanup();
            refreshGenerateButtonState();
        }

        async function deletePlayedVideo(filename) {
            try {
                const response = await fetch(`/api/v1/video/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.code === 0) {
                    console.log(`[VideoCleanup] Deleted: ${filename}`);
                } else {
                    console.warn(`[VideoCleanup] Failed to delete: ${filename}`, result.msg);
                }
            } catch (e) {
                console.error(`[VideoCleanup] Error deleting ${filename}:`, e);
            }
        }

        async function loadAvatars() {
            try {
                const response = await fetch('/list_avatars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const result = await response.json();
                if (result.code === 0 && result.data.avatars) {
                    state.avatars = {};
                    const emotionReactionConfig = result.data.emotion_reaction || {};
                    state.emotionFirstReaction.enabled = emotionReactionConfig.enabled === true;
                    state.emotionFirstReaction.delayMinMs = Number(emotionReactionConfig.delay_min_ms) || 2000;
                    state.emotionFirstReaction.delayMaxMs = Number(emotionReactionConfig.delay_max_ms) || state.emotionFirstReaction.delayMinMs;
                    state.emotionFirstReaction.happyReply = emotionReactionConfig.happy_reply || '';
                    state.emotionFirstReaction.sadReply = emotionReactionConfig.sad_reply || '';
                    elements.avatarList.innerHTML = '';
                    result.data.avatars.forEach(avatar => {
                        state.avatars[avatar.id] = avatar;
                        const item = document.createElement('div');
                        item.className = 'avatar-item' + (avatar.id === result.data.default ? ' active' : '');
                        item.dataset.avatarId = avatar.id;
                        item.innerHTML = `
                            <img class="avatar-preview" src="${avatar.source_image}" alt="${avatar.name}">
                            <div class="avatar-name">${avatar.name}</div>
                        `;
                        item.onclick = () => selectAvatar(avatar.id);
                        elements.avatarList.appendChild(item);
                    });
                    state.currentAvatar = result.data.default;
                    playIdleVideo(state.currentAvatar);
                }
            } catch (e) {
                console.error('Failed to load avatars:', e);
            }
        }

        function selectAvatar(avatarId) {
            if (state.isProcessing && state.mode === 'chat') return;
            state.currentAvatar = avatarId;
            document.querySelectorAll('.avatar-item').forEach(item => {
                item.classList.toggle('active', item.dataset.avatarId === avatarId);
            });
            playIdleVideo(avatarId);
        }

        function playIdleVideo(avatarId) {
            const avatar = state.avatars[avatarId];
            if (avatar && avatar.idle_video) {
                elements.videoOverlay.style.display = 'none';
                state.idleVideoUrl = avatar.idle_video;
                state.activeIdleVideo = 1;
                state.idleCrossfadeAlpha = 1.0;
                state.isIdleCrossfading = false;
                elements.idleVideo.src = avatar.idle_video;
                elements.idleVideo.load();
                setTimeout(() => {
                    elements.idleVideo2.src = avatar.idle_video;
                    elements.idleVideo2.load();
                }, 100);
                elements.idleVideo.play().catch(() => {});
            } else {
                elements.videoOverlay.innerHTML = '<div class="icon">👤</div><div>无待机动画</div>';
                elements.videoOverlay.style.display = 'flex';
                elements.idleVideo.src = '';
                elements.idleVideo2.src = '';
            }
        }

        function switchToListeningVideo() {
            const avatar = state.avatars[state.currentAvatar];
            if (!avatar || !avatar.listening_video || state.isListening) return;
            state.isListening = true;
            // Switch both idle videos to listening video
            const listeningUrl = avatar.listening_video;
            elements.idleVideo.src = listeningUrl;
            elements.idleVideo.load();
            elements.idleVideo.play().catch(() => {});
            setTimeout(() => {
                elements.idleVideo2.src = listeningUrl;
                elements.idleVideo2.load();
            }, 100);
        }

        function switchBackFromListening() {
            if (!state.isListening) return;
            state.isListening = false;
            // Restore idle video
            const avatar = state.avatars[state.currentAvatar];
            if (avatar && avatar.idle_video) {
                elements.idleVideo.src = avatar.idle_video;
                elements.idleVideo.load();
                elements.idleVideo.play().catch(() => {});
                setTimeout(() => {
                    elements.idleVideo2.src = avatar.idle_video;
                    elements.idleVideo2.load();
                }, 100);
            }
        }

        function initTabs() {
            document.querySelectorAll('.input-tab').forEach(tab => {
                tab.onclick = () => {
                    const previousTab = getActiveTabName();
                    const nextTab = tab.dataset.tab;

                    if (previousTab === nextTab) {
                        updateActionArea(nextTab);
                        return;
                    }

                    if (previousTab === 'emotion' && nextTab !== 'emotion') {
                        stopEmotionCameraForTabSwitch();
                    }

                    if (previousTab === 'tongue' && nextTab !== 'tongue') {
                        stopTonguePreview();
                    }

                    document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.input-tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(nextTab + '-input').classList.add('active');
                    updateActionArea(nextTab);
                };
            });
            updateActionArea();
        }

        function initAudioRecorder() {
            elements.recordBtn.onclick = toggleRecording;
            initEmotionTalkButton();
        }

        function initEmotionTalkButton() {
            const startHold = async (event) => {
                event?.preventDefault();
                if (state.isProcessing || state.isRecording || state.emotionHoldActive) return;

                state.emotionHoldActive = true;
                state.emotionHoldShouldStop = false;
                try {
                    elements.emotionTalkBtn.setPointerCapture?.(event.pointerId);
                } catch (e) {}

                state.emotionHoldStartPromise = startRecording({ mode: 'emotion-hold' });
                const started = await state.emotionHoldStartPromise;
                state.emotionHoldStartPromise = null;

                if (!started) {
                    state.emotionHoldActive = false;
                    state.emotionHoldShouldStop = false;
                    setEmotionTalkButtonState();
                    return;
                }

                if (state.emotionHoldShouldStop) {
                    await finishEmotionHoldRecording(event);
                }
            };

            const stopHold = async (event) => {
                event?.preventDefault();
                if (!state.emotionHoldActive) return;

                state.emotionHoldShouldStop = true;
                if (state.emotionHoldStartPromise) {
                    await state.emotionHoldStartPromise;
                }
                await finishEmotionHoldRecording(event);
            };

            elements.emotionTalkBtn.addEventListener('pointerdown', startHold);
            elements.emotionTalkBtn.addEventListener('pointerup', stopHold);
            elements.emotionTalkBtn.addEventListener('pointercancel', stopHold);
            elements.emotionTalkBtn.addEventListener('contextmenu', (event) => event.preventDefault());
            elements.emotionTalkBtn.addEventListener('keydown', async (event) => {
                if ((event.key === ' ' || event.key === 'Enter') && !state.emotionHoldActive) {
                    await startHold(event);
                }
            });
            elements.emotionTalkBtn.addEventListener('keyup', async (event) => {
                if (event.key === ' ' || event.key === 'Enter') {
                    await stopHold(event);
                }
            });
        }

        async function finishEmotionHoldRecording(event) {
            if (!state.emotionHoldActive) return;

            state.emotionHoldActive = false;
            try {
                if (event?.pointerId != null && elements.emotionTalkBtn.hasPointerCapture?.(event.pointerId)) {
                    elements.emotionTalkBtn.releasePointerCapture(event.pointerId);
                }
            } catch (e) {}

            if (!state.isRecording || state.recordingMode !== 'emotion-hold') {
                state.emotionHoldShouldStop = false;

            await generateVideo({
                audioBlob,

                useAsrUserText: true
            });
        }

        function initEmotionCapture() {
            // 检查必要的 DOM 元素
            if (!elements.emotionCamera || !elements.cameraOverlay || !elements.emotionEnabled) {
                console.error('[Emotion] Required DOM elements not found:', {
                    emotionCamera: !!elements.emotionCamera,
                    cameraOverlay: !!elements.cameraOverlay,
                    emotionEnabled: !!elements.emotionEnabled
                });
                return;
            }
            console.log('[Emotion] DOM elements verified');

            // 检查浏览器支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn('[Emotion] Browser does not support getUserMedia');
                elements.emotionEnabled.disabled = true;
                elements.emotionStatus.textContent = '浏览器不支持';
                return;
            }

            if (state.mockMode.enabled) {
                elements.emotionEnabled.addEventListener('change', function() {
                    if (this.checked) {
                        startMockEmotionCapture();
                    } else {
                        stopMockEmotionCapture();
                    }
                });
                return;
            }

            // 检查 EmotionCapture 类是否加载
            if (typeof EmotionCapture === 'undefined') {
                console.warn('[Emotion] EmotionCapture class not loaded');
                elements.emotionEnabled.disabled = true;
                elements.emotionStatus.textContent = '组件加载失败';
                return;
            }

            console.log('[Emotion] Creating EmotionCapture instance...');
            // 创建情绪捕捉实例
            emotionCapture = new EmotionCapture({
                serverUrl: '',
                sampleInterval: 30000,
                videoElement: elements.emotionCamera,
                sessionId: 'default',
                enabled: false
            });

            // 注册事件监听
            emotionCapture.on(EmotionCapture.Events.STARTED, () => {
                console.log('[Emotion] STARTED event received');
                resetEmotionTriggerSession();
                if (elements.cameraOverlay) {
                    elements.cameraOverlay.style.display = 'none';
                    console.log('[Emotion] Overlay hidden');
                } else {
                    console.error('[Emotion] cameraOverlay element not found!');
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '检测中...';
                }
                if (elements.emotionCamera) {
                    const video = elements.emotionCamera;
                    console.log('[Emotion] Video element state:', {
                        readyState: video.readyState,
                        videoWidth: video.videoWidth,
                        videoHeight: video.videoHeight,
                        srcObject: video.srcObject ? 'exists' : 'null',
                        paused: video.paused,
                        muted: video.muted,
                        display: getComputedStyle(video).display,
                        visibility: getComputedStyle(video).visibility,
                        opacity: getComputedStyle(video).opacity
                    });
                    // 强制确保视频可见
                    video.style.display = 'block';
                    video.style.visibility = 'visible';
                    video.style.opacity = '1';
                    video.play().catch(e => console.warn('[Emotion] Play error:', e));
                }
            });

            emotionCapture.on(EmotionCapture.Events.STOPPED, () => {
                console.log('[Emotion] STOPPED event received');
                resetEmotionTriggerSession();
                if (elements.cameraOverlay) {
                    elements.cameraOverlay.style.display = 'flex';
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '已停止';
                }
                resetEmotionUI();
                if (!state.isProcessing && !state.responsePlayback.busy) {
                    setStatus('ready', '准备就绪');
                }
            });

            emotionCapture.on(EmotionCapture.Events.DETECTED, (emotion) => {
                updateEmotionUI(emotion);
                maybeTriggerFirstEmotionReaction(emotion);
            });

            emotionCapture.on(EmotionCapture.Events.ERROR, (data) => {
                console.error('[Emotion] Error:', data);
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '错误: ' + (data.message || '未知');
                }
            });

            emotionCapture.on(EmotionCapture.Events.PERMISSION_DENIED, () => {
                console.log('[Emotion] Permission denied');
                if (elements.emotionEnabled) {
                    elements.emotionEnabled.checked = false;
                }
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '摄像头权限被拒绝';
                }
                alert('无法访问摄像头，请在浏览器设置中允许摄像头权限');
            });

            emotionCapture.on(EmotionCapture.Events.DISABLED, () => {
                if (elements.emotionStatus) {
                    elements.emotionStatus.textContent = '功能未启用（后端）';
                }
            });

            // 开关事件
            elements.emotionEnabled.addEventListener('change', function() {
                if (this.checked) {
                    emotionCapture.start();
                } else {
                    emotionCapture.stop();
                }
            });
        }

        function updateEmotionUI(emotion) {
            if (!emotion) return;

            // 更新情绪图标和文本
            const dominantEmotion = emotion.dominant_emotion || 'neutral';
            elements.emotionIcon.textContent = EMOTION_CONFIG.icons[dominantEmotion] || '😐';
            elements.emotionText.textContent = EMOTION_CONFIG.names[dominantEmotion] || '未知';

            const items = elements.emotionScores.querySelectorAll('.emotion-score-item');

            // 映射简化显示的情绪（只显示 4 个主要情绪）
            const displayEmotions = ['happy', 'sad', 'angry', 'neutral'];

            items.forEach((item, index) => {
                const emotionKey = displayEmotions[index];
                const score = scores[emotionKey] || 0;
                const fill = item.querySelector('.emotion-score-fill');

                if (fill) {
                    fill.style.width = score + '%';
                }
                if (value) {
                    value.textContent = score.toFixed(0) + '%';
                }
            });

            const confidence = emotion.confidence || 0;
            elements.emotionStatus.textContent = `检测中... (置信度: ${confidence.toFixed(0)}%)`;
        }

        async function toggleRecording() {
            if (state.recordingMode === 'emotion-hold') return;
            if (state.isRecording) {
                await stopRecording();
            } else {
                await startRecording({ mode: 'manual' });
            }
        }

        async function startRecording({ mode = 'manual' } = {}) {
            if (state.isRecording || state.isProcessing) return false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.recordingStream = stream;
                state.recordingMode = mode;
                state.mediaRecorder = new MediaRecorder(stream);
                state.recordedChunks = [];
                state.recordingStopPromise = new Promise(resolve => {
                    state.recordingStopResolve = resolve;
                });
                state.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) state.recordedChunks.push(e.data);
                };
                state.mediaRecorder.onstop = () => {
                    const preferredType = state.recordedChunks[0]?.type || state.mediaRecorder?.mimeType || 'audio/webm';
                    state.recordedBlob = new Blob(state.recordedChunks, { type: preferredType });
                    if (mode === 'manual') {
                        updateRecordedAudioPreview(state.recordedBlob);
                    }
                    stream.getTracks().forEach(track => track.stop());
                    state.recordingStream = null;
                    state.mediaRecorder = null;
                    state.recordingMode = null;
                    const resolve = state.recordingStopResolve;
                    state.recordingStopResolve = null;
                    const finishedBlob = state.recordedBlob;
                    state.recordingStopPromise = null;
                    resolve?.(finishedBlob);
                };
                state.mediaRecorder.start();
                state.isRecording = true;
                switchToListeningVideo();
                if (mode === 'manual') {
                    elements.recordBtn.classList.add('recording');
                    elements.recordHint.textContent = '点击停止录音';
                } else if (mode === 'emotion-hold') {
                    setEmotionTalkButtonState({ recording: true, text: '松开结束并识别' });
                    setStatus('processing', '正在听你说话...');
                }
                return true;
            } catch (e) {
                console.error('Failed to start recording:', e);
                state.recordingMode = null;
                state.recordingStream = null;
                state.recordingStopPromise = null;
                state.recordingStopResolve = null;
                alert('无法访问麦克风，请检查权限设置');
                return false;
            }
        }

        function stopRecording() {
            if (!state.mediaRecorder || !state.isRecording) {
                return Promise.resolve(state.recordedBlob);
            }

            const mode = state.recordingMode;
            state.isRecording = false;
            switchBackFromListening();

            if (mode === 'manual') {
                elements.recordBtn.classList.remove('recording');
                elements.recordHint.textContent = '点击重新录音';
            } else if (mode === 'emotion-hold') {
                setEmotionTalkButtonState({ text: '识别中，请稍候...' });
            }

            state.mediaRecorder.stop();
            return state.recordingStopPromise || Promise.resolve(state.recordedBlob);
        }

        async function generateVideo(options = {}) {
            if (state.isProcessing) return;

            // Mock 模式拦截
            if (state.mockMode.enabled) {
                return generateMockVideo(options);
            }

            const activeTab = options.sourceTab || getActiveTabName();
            let text = typeof options.text === 'string' ? options.text.trim() : '';
            let audioBlob = options.audioBlob || null;
            let pendingUserMessage = options.pendingUserMessage || '【语音识别中...】';
            let userMessageIndex = -1;

            if (!text && !audioBlob) {
                if (activeTab === 'text') {
                    text = elements.userText.value.trim();
                    if (!text) {
                        alert('请输入内容');
                        return;
                    }
                } else {
                    if (!state.recordedBlob) {
                        alert('请先录制语音');
                        return;
                    }
                    audioBlob = state.recordedBlob;
                }
            }

            if (text) {
                state.lastSubmittedText = text;
                if (activeTab === 'text') {
                    elements.userText.value = '';
                    elements.userText.style.height = '96px';
                }
                addMessage('user', text);
            } else {
                userMessageIndex = addMessage('user', pendingUserMessage);
            }

            state.isProcessing = true;
            refreshGenerateButtonState();
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.paused) activeIdle.play().catch(() => {});
            const inactiveIdle = state.activeIdleVideo === 1 ? elements.idleVideo2 : elements.idleVideo;
            if (inactiveIdle.readyState < 2) inactiveIdle.load();

            setStatus('processing', '正在生成... (预计 15-25 秒)');
            setTyping(true);

            try {
                const formData = new FormData();
                if (text) {
                    formData.append('text', text);
                } else if (audioBlob) {
                    formData.append('audio', audioBlob, 'recording.wav');
                }
                formData.append('source_image', state.currentAvatar);

                const response = await fetch('/api/v1/generate', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.code !== 0) throw new Error(result.msg || '生成失败');

                const data = result.data;
                elements.progress.style.width = '100%';
                setStatus('success', `生成完成，耗时 ${data.total_time.toFixed(1)} 秒`);

                if (!text && userMessageIndex >= 0) {
                    const recognizedUserText = (data.user_text || '').trim() || '【语音输入】';
                    updateMessageText(userMessageIndex, recognizedUserText);
                }

                setTyping(false);
                addMessage('assistant', data.response_text || '已生成回复');

                const dataMetrics = data.metrics || {};
                metrics.total.textContent = data.total_time.toFixed(1) + 's';
                metrics.llm.textContent = (dataMetrics.llm_time || 0).toFixed(1) + 's';
                metrics.tts.textContent = (dataMetrics.tts_time || 0).toFixed(1) + 's';
                metrics.video.textContent = (dataMetrics.video_time || 0).toFixed(1) + 's';

                // 提取视频文件名（格式: /videos/xxx.mp4）
                const videoFilename = data.video_url.split('/').pop().split('?')[0];
                playManagedResponseVideo({
                    videoUrl: data.video_url + '?t=' + Date.now(),
                    source: 'generated',
                    deleteAfterPlay: true,
                    filename: videoFilename
                });
            } catch (error) {
                console.error('Generation error:', error);
                setTyping(false);
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入失败】');
                }
                addMessage('assistant', `生成失败：${error.message}`);
                setStatus('error', '生成失败: ' + error.message);
            } finally {
                setTyping(false);
                state.isProcessing = false;
                if (!state.responsePlayback.busy) {
                    tryPlayPendingEmotionVideo();
                }
                refreshGenerateButtonState();
                if (activeTab === 'emotion') {
                    setEmotionTalkButtonState();
                }
            }
        }

        async function generateMockVideo(options = {}) {
            if (state.isProcessing || state.mockMode.isMockPlaying || state.responsePlayback.busy) return;

            const activeTab = options.sourceTab || getActiveTabName();
            let text = typeof options.text === 'string' ? options.text.trim() : '';
            let audioBlob = options.audioBlob || null;
            let userMessageIndex = -1;

            if (!text && !audioBlob) {
                if (activeTab === 'text') {
                    text = elements.userText.value.trim();
                    if (!text) { alert('请输入内容'); return; }
                } else {
                    if (!state.recordedBlob) { alert('请先录制语音'); return; }
                    audioBlob = state.recordedBlob;
                }
            }

            if (text) {
                state.lastSubmittedText = text;
                if (activeTab === 'text') {
                    elements.userText.value = '';
                    elements.userText.style.height = '96px';
                }
                addMessage('user', text);
            } else {
                userMessageIndex = addMessage('user', options.pendingUserMessage || '【语音识别中...】');
            }

            state.isProcessing = true;
            state.mockMode.isMockPlaying = true;
            refreshGenerateButtonState();

            setStatus('processing', '正在思考...');
            setTyping(true);

            try {
                const stepCount = Math.min(state.mockMode.responses.length, state.mockMode.videos.length);
                if (stepCount <= 0) {
                    throw new Error('Mock 配置不完整');
                }

                const stepIndex = state.mockMode.currentIndex % stepCount;
                const mockResponse = state.mockMode.responses[stepIndex];
                const mockVideoUrl = state.mockMode.videos[stepIndex];

                // 2-3秒随机延迟
                const delay = 2000 + Math.random() * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));

                setStatus('success', '生成完成');
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入】');
                }
                setTyping(false);
                addMessage('assistant', mockResponse);

                // 模拟指标
                metrics.total.textContent = (delay/1000 + 0.5).toFixed(1) + 's';
                metrics.llm.textContent = (delay/1000 * 0.4).toFixed(1) + 's';
                metrics.tts.textContent = (delay/1000 * 0.2).toFixed(1) + 's';
                metrics.video.textContent = (delay/1000 * 0.4).toFixed(1) + 's';

                playManagedResponseVideo({
                    videoUrl: mockVideoUrl + '?t=' + Date.now(),
                    source: 'mock',
                    deleteAfterPlay: false,
                    filename: null
                });

                // 步进到下一个（循环）
                state.mockMode.currentIndex = (state.mockMode.currentIndex + 1) % stepCount;

            } catch (error) {
                setTyping(false);
                if (!text && userMessageIndex >= 0) {
                    updateMessageText(userMessageIndex, '【语音输入失败】');
                }
                addMessage('assistant', `Mock 错误：${error.message}`);
                setStatus('error', 'Mock 错误: ' + error.message);
            } finally {
                setTyping(false);
                state.isProcessing = false;
                state.mockMode.isMockPlaying = false;
                if (!state.responsePlayback.busy) {
                    tryPlayPendingEmotionVideo();
                }
                refreshGenerateButtonState();
                if (activeTab === 'emotion') {
                    setEmotionTalkButtonState();
                }
            }
        }

        function playResponseVideo(videoUrl) {
            // 在切换前确保 idle 帧缓冲已保存
            const activeIdle = state.activeIdleVideo === 1 ? elements.idleVideo : elements.idleVideo2;
            if (activeIdle.readyState >= 2 && activeIdle.videoWidth > 0) {
                saveFrameBuffer('idle', activeIdle);
            }

            elements.responseVideo.src = videoUrl;
            elements.responseVideo.load();

            let hasStartedSwitch = false;

            const tryStartSwitch = () => {
                if (hasStartedSwitch) return;
                if (elements.responseVideo.readyState >= 2 && elements.responseVideo.videoWidth > 0) {
                    hasStartedSwitch = true;
                    // 先保存 response 第一帧到缓冲
                    saveFrameBuffer('response', elements.responseVideo);
                    // 暂停 idle 视频（节省资源，保持帧缓冲稳定）
                    elements.idleVideo.pause();
                    elements.idleVideo2.pause();
                    // 开始切换
                    state.showingResponse = true;
                    switchToResponseVideo();
                    // 播放视频
                    elements.responseVideo.play().catch(() => {});
                }
            };

            // 监听多个事件确保尽早开始
            elements.responseVideo.onloadeddata = () => {
                setTimeout(tryStartSwitch, 20);
            };
            elements.responseVideo.oncanplay = tryStartSwitch;
            elements.responseVideo.oncanplaythrough = tryStartSwitch;

            // 备用检查
            const checkReady = () => {
                if (!hasStartedSwitch) {
                    tryStartSwitch();
                    if (!hasStartedSwitch) {
                        setTimeout(checkReady, 50);
                    }
                }
            };
            setTimeout(checkReady, 100);
        }

        function startProgressAnimation() {
            let currentProgress = 0;
            const steps = [15, 30, 50, 80, 95];
            let stepIndex = 0;
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (stepIndex >= steps.length) return;
                if (currentProgress < steps[stepIndex]) {
                    currentProgress += 1;
                    elements.progress.style.width = currentProgress + '%';
                } else {
                    stepIndex += 1;
                }
            }, 200);
        }

        function stopProgressAnimation() {
            if (progressInterval) {

                progressInterval = null;

            } catch { return []; }

        function saveSessions(sessions) {
            while (sessions.length > HISTORY_MAX_SESSIONS) sessions.pop();
            try {
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify({ sessions }));
            } catch (e) {
                console.warn('历史记录保存失败:', e);
            }
        }

            sessions.unshift({
                id,
                title: '',

                avatarKey: state.currentAvatar,
                createdAt: new Date().toISOString(),

        function saveCurrentSession() {
            if (!state.currentSessionId || state.chatHistory.length === 0) return;
            const sessions = loadSessions();
            const idx = sessions.findIndex(s => s.id === state.currentSessionId);
            if (idx === -1) return;
            const session = sessions[idx];
            session.messages = state.chatHistory.map(m => ({ role: m.role, text: m.text, time: m.time }));
            session.updatedAt = new Date().toISOString();
            if (!session.title) {
                const firstUser = state.chatHistory.find(m => m.role === 'user');
                session.title = firstUser ? firstUser.text.slice(0, 30) : '';
            }
            session.avatarName = state.avatars[state.currentAvatar]?.name || '数字人';
            session.avatarKey = state.currentAvatar;
            saveSessions(sessions);
        }

                const sessions = loadSessions();
                const idx = sessions.findIndex(s => s.id === state.currentSessionId);

        // Format time
        function formatRelativeTime(isoString) {
            const d = new Date(isoString);
            const now = new Date();
            const diffMs = now - d;
            const diffMin = Math.floor(diffMs / 60000);
            const diffH = Math.floor(diffMs / 3600000);
            const diffD = Math.floor(diffMs / 86400000);
            if (diffMin < 1) return '刚刚';
            if (diffMin < 60) return diffMin + ' 分钟前';
            if (diffH < 24 && d.getDate() === now.getDate()) return '今天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            if (diffD < 2) return '昨天';
            if (diffD < 7) return diffD + ' 天前';
            return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
        }
